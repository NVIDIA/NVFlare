<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-labelledby="t d">
<title id="t">What is held during one apply</title><desc id="d">Timeline of one apply: _result_lock for the whole apply, manager._lock only at the ends, store.lock per client commit.</desc>
<style>
:root { --bg:#fbfcfb; --zone:#f0f3f2; --surface:#ffffff; --ink:#1b2422; --muted:#5a6764; --line:#b9c4c0;
  --accent:#0b6e67; --accent-tint:#d7ece9; --warn:#8f5400; --warn-tint:#f5e5c6; }
@media (prefers-color-scheme: dark) { :root { --bg:#14191a; --zone:#1b2322; --surface:#202928; --ink:#e3eae7;
  --muted:#9aa7a3; --line:#3b4845; --accent:#55c7bb; --accent-tint:#17332f; --warn:#e5a94c; --warn-tint:#3a2f17; } }
.bg { fill:var(--bg); }
.zone { fill:var(--zone); stroke:var(--line); stroke-width:1.2; }
.box { fill:var(--surface); stroke:var(--line); stroke-width:1.3; }
.box.a { fill:var(--accent-tint); stroke:var(--accent); }
.box.w { fill:var(--warn-tint); stroke:var(--warn); }
.cell { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.cell.good { fill:var(--accent-tint); stroke:var(--accent); }
.cell.warn { fill:var(--warn-tint); stroke:var(--warn); }
text { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--ink); }
.b { font-weight:600; }
.m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.l { font-size:12px; }
.s { font-size:11.5px; }
.muted { fill:var(--muted); }
.warnt { fill:var(--warn); }
.zt { font-size:12px; font-weight:600; letter-spacing:0.06em; fill:var(--muted); }
.arr { fill:none; stroke:var(--muted); stroke-width:1.6; }
.arr.d { stroke-dasharray:5 4; }
.head { fill:var(--muted); }
.brace { stroke:var(--muted); stroke-width:1.2; fill:none; }
.band { fill:transparent; }
.band.alt { fill:var(--zone); opacity:0.7; }
.dot.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:2; }
.dot.brief { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.bar.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:1.2; }
.bar.brief { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
.bar.none { fill:var(--surface); stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 3; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="306" rx="10"/>
<text class="l muted" x="10" y="20" text-anchor="start">One apply of a finished job, left to right in time</text>
<rect class="band" x="0" y="28" width="960" height="46"/>
<text class="m b" x="10" y="56" text-anchor="start">_result_lock</text>
<rect class="band alt" x="0" y="78" width="960" height="46"/>
<text class="m b" x="10" y="106" text-anchor="start">manager._lock</text>
<rect class="band" x="0" y="128" width="960" height="46"/>
<text class="m b" x="10" y="156" text-anchor="start">store.lock</text>
<rect class="band alt" x="0" y="178" width="960" height="46"/>
<text class="m b" x="10" y="206" text-anchor="start">no lock</text>
<rect class="bar held" x="190" y="34" width="750" height="30" rx="4"/><text class="l" x="565" y="54" text-anchor="middle">held for the whole apply</text>
<rect class="bar brief" x="190" y="84" width="40" height="30" rx="4"/><text class="l" x="236" y="104" text-anchor="start">still pending?</text>
<rect class="bar brief" x="880" y="84" width="60" height="30" rx="4"/><text class="l" x="874" y="104" text-anchor="end">drop from pending</text>
<rect class="bar held" x="380" y="134" width="110" height="30" rx="4"/><text class="l" x="435" y="154" text-anchor="middle">client 1</text>
<rect class="bar held" x="520" y="134" width="110" height="30" rx="4"/><text class="l" x="575" y="154" text-anchor="middle">client 2</text>
<rect class="bar held" x="660" y="134" width="110" height="30" rx="4"/><text class="l" x="715" y="154" text-anchor="middle">client 3</text>
<rect class="bar none" x="230" y="184" width="140" height="30" rx="4"/><text class="l s" x="300" y="204" text-anchor="middle">read inbox or archive</text>
<rect class="bar none" x="780" y="184" width="95" height="30" rx="4"/><text class="l s" x="827" y="204" text-anchor="middle">cleanup files</text>
<text class="l" x="10" y="246" text-anchor="start">Inside each store.lock bar: copy the client's state, edit the copy, write the temp file, fsync, rename, swap the in-memory state.</text>
<text class="l warnt" x="10" y="268" text-anchor="start">Another job finishing waits at the right of the top bar: its archive hook needs _result_lock.</text>
<text class="l warnt" x="10" y="290" text-anchor="start">A catalog search waits only while a store.lock bar is running; it builds its results after releasing the lock.</text>
</svg>
