<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456" width="1040" height="456" role="img" aria-labelledby="t d">
<title id="t">Architecture at a glance</title><desc id="d">A user submits a catalog job. The server's job runner starts the controller and calls the manager's hooks. The controller sends tasks to each site's executor, which reads site-owned policy and mounted datasets through connectors. The controller returns a signed manifest to the manager, which reconciles it into the catalog store. Search reads the store.</desc>
<style>
:root { --bg:#fbfcfb; --zone:#f0f3f2; --surface:#ffffff; --ink:#1b2422; --muted:#5a6764; --line:#b9c4c0;
  --accent:#0b6e67; --accent-tint:#d7ece9; --warn:#8f5400; --warn-tint:#f5e5c6; }
@media (prefers-color-scheme: dark) { :root { --bg:#14191a; --zone:#1b2322; --surface:#202928; --ink:#e3eae7;
  --muted:#9aa7a3; --line:#3b4845; --accent:#55c7bb; --accent-tint:#17332f; --warn:#e5a94c; --warn-tint:#3a2f17; } }
.bg { fill:var(--bg); }
.zone { fill:var(--zone); stroke:var(--line); stroke-width:1.2; }
.box { fill:var(--surface); stroke:var(--line); stroke-width:1.3; }
.box.a { fill:var(--accent-tint); stroke:var(--accent); }
.box.w { fill:var(--warn-tint); stroke:var(--warn); }
.cell { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.cell.good { fill:var(--accent-tint); stroke:var(--accent); }
.cell.warn { fill:var(--warn-tint); stroke:var(--warn); }
text { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--ink); }
.b { font-weight:600; }
.m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.l { font-size:12px; }
.s { font-size:11.5px; }
.muted { fill:var(--muted); }
.warnt { fill:var(--warn); }
.zt { font-size:12px; font-weight:600; letter-spacing:0.06em; fill:var(--muted); }
.arr { fill:none; stroke:var(--muted); stroke-width:1.6; }
.arr.d { stroke-dasharray:5 4; }
.head { fill:var(--muted); }
.brace { stroke:var(--muted); stroke-width:1.2; fill:none; }
.band { fill:transparent; }
.band.alt { fill:var(--zone); opacity:0.7; }
.dot.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:2; }
.dot.brief { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.bar.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:1.2; }
.bar.brief { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
.bar.none { fill:var(--surface); stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 3; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="bg" x="0" y="0" width="1040" height="456" rx="10"/>
<rect class="zone" x="10" y="40" width="170" height="380" rx="10"/><text class="zt" x="24" y="62">PARTICIPATING USER</text>
<rect class="zone" x="200" y="40" width="470" height="380" rx="10"/><text class="zt" x="214" y="62">FLARE SERVER</text>
<rect class="zone" x="690" y="40" width="340" height="380" rx="10"/><text class="zt" x="704" y="62">EACH SITE</text>
<rect class="box" x="22" y="80" width="146" height="80" rx="7"/>
<text class="b" x="95.0" y="107.5" text-anchor="middle">Run a read</text>
<text class="m" x="95.0" y="124.5" text-anchor="middle">nvflare catalog read</text>
<text class="m" x="95.0" y="141.5" text-anchor="middle">python job.py</text>
<rect class="box" x="22" y="330" width="146" height="70" rx="7"/>
<text class="b" x="95.0" y="352.5" text-anchor="middle">Browse</text>
<text class="m" x="95.0" y="369.5" text-anchor="middle">nvflare catalog show</text>
<text class="" x="95.0" y="386.5" text-anchor="middle">and search</text>
<rect class="box" x="215" y="80" width="200" height="60" rx="7"/>
<text class="b" x="315.0" y="106.0" text-anchor="middle">Job runner</text>
<text class="" x="315.0" y="123.0" text-anchor="middle">existing</text>
<rect class="box a" x="455" y="80" width="200" height="60" rx="7"/>
<text class="b" x="555.0" y="106.0" text-anchor="middle">CatalogController</text>
<text class="" x="555.0" y="123.0" text-anchor="middle">inside the catalog job</text>
<rect class="box a" x="215" y="190" width="200" height="72" rx="7"/>
<text class="b" x="315.0" y="213.5" text-anchor="middle">CatalogManager</text>
<text class="" x="315.0" y="230.5" text-anchor="middle">hands over, captures,</text>
<text class="" x="315.0" y="247.5" text-anchor="middle">applies results</text>
<rect class="box" x="215" y="285" width="200" height="50" rx="7"/>
<text class="b" x="315.0" y="306.0" text-anchor="middle">Catalog store</text>
<text class="" x="315.0" y="323.0" text-anchor="middle">one file per client</text>
<rect class="box" x="215" y="370" width="200" height="44" rx="7"/>
<text class="b" x="315.0" y="388.0" text-anchor="middle">Catalog commands</text>
<text class="" x="315.0" y="405.0" text-anchor="middle">search and status</text>
<rect class="box a" x="712" y="80" width="300" height="70" rx="7"/>
<text class="b" x="862.0" y="102.5" text-anchor="middle">CatalogExecutor</text>
<text class="" x="862.0" y="119.5" text-anchor="middle">reads one dataset at a time</text>
<text class="" x="862.0" y="136.5" text-anchor="middle">applies the site's policy</text>
<rect class="box w" x="712" y="190" width="160" height="76" rx="7"/>
<text class="b" x="792.0" y="215.5" text-anchor="middle">Site-owned files</text>
<text class="m" x="792.0" y="232.5" text-anchor="middle">catalog_site.json</text>
<text class="m" x="792.0" y="249.5" text-anchor="middle">catalog_policy.json</text>
<rect class="box" x="882" y="190" width="138" height="76" rx="7"/>
<text class="b" x="951.0" y="215.5" text-anchor="middle">Connectors</text>
<text class="" x="951.0" y="232.5" text-anchor="middle">parquet, csv, sql,</text>
<text class="" x="951.0" y="249.5" text-anchor="middle">unity-catalog</text>
<rect class="box" x="882" y="320" width="138" height="70" rx="7"/>
<text class="b" x="951.0" y="342.5" text-anchor="middle">Mounted Study</text>
<text class="" x="951.0" y="359.5" text-anchor="middle">datasets</text>
<text class="" x="951.0" y="376.5" text-anchor="middle">metadata only</text>
<polyline class="arr" points="168,110 215,110" marker-end="url(#ah)"/>
<text class="l s" x="191" y="102" text-anchor="middle">submit</text>
<polyline class="arr" points="415,110 455,110" marker-end="url(#ah)"/>
<text class="l s" x="435" y="102" text-anchor="middle">starts</text>
<polyline class="arr" points="315,140 315,190" marker-end="url(#ah)"/>
<text class="l s" x="322" y="170" text-anchor="start">launch and archive hooks</text>
<polyline class="arr" points="555,140 555,226 415,226" marker-end="url(#ah)"/>
<text class="l s" x="562" y="190" text-anchor="start">signed manifest</text>
<polyline class="arr" points="315,262 315,285" marker-end="url(#ah)"/>
<text class="l s" x="322" y="278" text-anchor="start">reconcile</text>
<polyline class="arr" points="315,370 315,335" marker-end="url(#ah)"/>
<text class="l s" x="322" y="357" text-anchor="start">reads</text>
<polyline class="arr" points="168,365 190,365 190,392 215,392" marker-end="url(#ah)"/>
<polyline class="arr" points="655,100 712,100" marker-end="url(#ah)"/>
<text class="l s" x="683" y="92" text-anchor="middle">task</text>
<polyline class="arr" points="712,128 655,128" marker-end="url(#ah)"/>
<text class="l s" x="683" y="144" text-anchor="middle">results</text>
<polyline class="arr" points="792,150 792,190" marker-end="url(#ah)"/>
<polyline class="arr" points="951,150 951,190" marker-end="url(#ah)"/>
<polyline class="arr" points="951,266 951,320" marker-end="url(#ah)"/>
<text class="l s" x="958" y="300" text-anchor="start">schema only</text>
<text class="l muted" x="22" y="440" text-anchor="start">Amber boxes are owned and controlled by the site. The server never reads a source.</text>
</svg>
