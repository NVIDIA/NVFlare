<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392" width="980" height="392" role="img" aria-labelledby="t d">
<title id="t">Connectors</title><desc id="d">The executor builds one connector for each configured connector that the Study's datasets use. Parquet, CSV, SQL and Unity Catalog implement the CatalogConnector interface; ReaderConnector delegates to an optional CatalogReader component.</desc>
<style>
:root { --bg:#fbfcfb; --zone:#f0f3f2; --surface:#ffffff; --ink:#1b2422; --muted:#5a6764; --line:#b9c4c0;
  --accent:#0b6e67; --accent-tint:#d7ece9; --warn:#8f5400; --warn-tint:#f5e5c6; }
@media (prefers-color-scheme: dark) { :root { --bg:#14191a; --zone:#1b2322; --surface:#202928; --ink:#e3eae7;
  --muted:#9aa7a3; --line:#3b4845; --accent:#55c7bb; --accent-tint:#17332f; --warn:#e5a94c; --warn-tint:#3a2f17; } }
.bg { fill:var(--bg); }
.zone { fill:var(--zone); stroke:var(--line); stroke-width:1.2; }
.box { fill:var(--surface); stroke:var(--line); stroke-width:1.3; }
.box.a { fill:var(--accent-tint); stroke:var(--accent); }
.box.w { fill:var(--warn-tint); stroke:var(--warn); }
.cell { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.cell.good { fill:var(--accent-tint); stroke:var(--accent); }
.cell.warn { fill:var(--warn-tint); stroke:var(--warn); }
text { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--ink); }
.b { font-weight:600; }
.m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.l { font-size:12px; }
.s { font-size:11.5px; }
.muted { fill:var(--muted); }
.warnt { fill:var(--warn); }
.zt { font-size:12px; font-weight:600; letter-spacing:0.06em; fill:var(--muted); }
.arr { fill:none; stroke:var(--muted); stroke-width:1.6; }
.arr.d { stroke-dasharray:5 4; }
.head { fill:var(--muted); }
.brace { stroke:var(--muted); stroke-width:1.2; fill:none; }
.band { fill:transparent; }
.band.alt { fill:var(--zone); opacity:0.7; }
.dot.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:2; }
.dot.brief { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.bar.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:1.2; }
.bar.brief { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
.bar.none { fill:var(--surface); stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 3; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="392" rx="10"/>
<rect class="box a" x="290" y="20" width="320" height="92" rx="7"/>
<text class="b" x="450.0" y="45.0" text-anchor="middle">CatalogConnector (interface)</text>
<text class="m" x="450.0" y="62.0" text-anchor="middle">source</text>
<text class="m" x="450.0" y="79.0" text-anchor="middle">read_catalog(dataset, limits, options)</text>
<text class="m" x="450.0" y="96.0" text-anchor="middle">close()</text>
<rect class="box" x="10" y="200" width="175" height="54" rx="7"/>
<text class="b" x="97.5" y="231.5" text-anchor="middle">ParquetConnector</text>

<rect class="box" x="195" y="200" width="175" height="54" rx="7"/>
<text class="b" x="282.5" y="231.5" text-anchor="middle">CSVConnector</text>

<rect class="box" x="380" y="200" width="175" height="54" rx="7"/>
<text class="b" x="467.5" y="231.5" text-anchor="middle">SQLConnector</text>

<rect class="box" x="565" y="200" width="175" height="54" rx="7"/>
<text class="b" x="652.5" y="231.5" text-anchor="middle">UnityCatalogConnector</text>

<line class="brace" x1="97" y1="200" x2="97" y2="160"/>
<line class="brace" x1="282" y1="200" x2="282" y2="160"/>
<line class="brace" x1="467" y1="200" x2="467" y2="160"/>
<line class="brace" x1="652" y1="200" x2="652" y2="160"/>
<line class="brace" x1="97" y1="160" x2="652" y2="160"/>
<line class="brace" x1="450" y1="160" x2="450" y2="112"/>
<text class="l s" x="460" y="140" text-anchor="start">implement the interface</text>
<rect class="box" x="770" y="200" width="190" height="74" rx="7"/>
<text class="b" x="865.0" y="224.5" text-anchor="middle">ReaderConnector</text>
<text class="" x="865.0" y="241.5" text-anchor="middle">used when CatalogRecipe</text>
<text class="" x="865.0" y="258.5" text-anchor="middle">is given catalog_reader</text>
<polyline class="arr" points="865,274 865,320" marker-end="url(#ah)"/>
<rect class="box w" x="770" y="320" width="190" height="54" rx="7"/>
<text class="b" x="865.0" y="343.0" text-anchor="middle">CatalogReader</text>
<text class="" x="865.0" y="360.0" text-anchor="middle">your own component</text>
<text class="l s" x="872" y="298" text-anchor="start">delegates to</text>
</svg>
