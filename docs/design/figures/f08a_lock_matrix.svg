<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="t d">
<title id="t">Who takes which lock</title><desc id="d">Matrix of threads against locks, marking whether each lock is held across disk work or briefly in memory.</desc>
<style>
:root { --bg:#fbfcfb; --zone:#f0f3f2; --surface:#ffffff; --ink:#1b2422; --muted:#5a6764; --line:#b9c4c0;
  --accent:#0b6e67; --accent-tint:#d7ece9; --warn:#8f5400; --warn-tint:#f5e5c6; }
@media (prefers-color-scheme: dark) { :root { --bg:#14191a; --zone:#1b2322; --surface:#202928; --ink:#e3eae7;
  --muted:#9aa7a3; --line:#3b4845; --accent:#55c7bb; --accent-tint:#17332f; --warn:#e5a94c; --warn-tint:#3a2f17; } }
.bg { fill:var(--bg); }
.zone { fill:var(--zone); stroke:var(--line); stroke-width:1.2; }
.box { fill:var(--surface); stroke:var(--line); stroke-width:1.3; }
.box.a { fill:var(--accent-tint); stroke:var(--accent); }
.box.w { fill:var(--warn-tint); stroke:var(--warn); }
.cell { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.cell.good { fill:var(--accent-tint); stroke:var(--accent); }
.cell.warn { fill:var(--warn-tint); stroke:var(--warn); }
text { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--ink); }
.b { font-weight:600; }
.m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.l { font-size:12px; }
.s { font-size:11.5px; }
.muted { fill:var(--muted); }
.warnt { fill:var(--warn); }
.zt { font-size:12px; font-weight:600; letter-spacing:0.06em; fill:var(--muted); }
.arr { fill:none; stroke:var(--muted); stroke-width:1.6; }
.arr.d { stroke-dasharray:5 4; }
.head { fill:var(--muted); }
.brace { stroke:var(--muted); stroke-width:1.2; fill:none; }
.band { fill:transparent; }
.band.alt { fill:var(--zone); opacity:0.7; }
.dot.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:2; }
.dot.brief { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.bar.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:1.2; }
.bar.brief { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
.bar.none { fill:var(--surface); stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 3; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="484" rx="10"/>
<text class="m b" x="381.5" y="32" text-anchor="middle">queue</text>
<text class="m b" x="484.5" y="24" text-anchor="middle">manager</text>
<text class="m b" x="484.5" y="40" text-anchor="middle">_result_lock</text>
<text class="m b" x="587.5" y="24" text-anchor="middle">manager</text>
<text class="m b" x="587.5" y="40" text-anchor="middle">_lock</text>
<text class="m b" x="690.5" y="24" text-anchor="middle">store.lock</text>
<text class="m b" x="690.5" y="40" text-anchor="middle">re-entrant</text>
<text class="m b" x="793.5" y="24" text-anchor="middle">controller</text>
<text class="m b" x="793.5" y="40" text-anchor="middle">_write_lock</text>
<text class="m b" x="896.5" y="24" text-anchor="middle">controller</text>
<text class="m b" x="896.5" y="40" text-anchor="middle">_lock</text>
<text class="l muted" x="10" y="32" text-anchor="start">Thread, and what it runs</text>
<rect class="band" x="0" y="56" width="960" height="40"/>
<text class="l b" x="10" y="73" text-anchor="start">Job runner</text>
<text class="l muted" x="10" y="88" text-anchor="start">BEFORE_JOB_LAUNCH: _hand_over</text>
<circle class="dot brief" cx="587.5" cy="76.0" r="10"/>
<rect class="band alt" x="0" y="96" width="960" height="40"/>
<text class="l b" x="10" y="113" text-anchor="start">Completion thread</text>
<text class="l muted" x="10" y="128" text-anchor="start">BEFORE_JOB_WORKSPACE_ARCHIVE: _take_back</text>
<circle class="dot held" cx="484.5" cy="116.0" r="10"/>
<rect class="band" x="0" y="136" width="960" height="40"/>
<text class="l b" x="10" y="153" text-anchor="start">Completion thread</text>
<text class="l muted" x="10" y="168" text-anchor="start">JOB_COMPLETED or JOB_ABORTED: enqueue id</text>
<circle class="dot brief" cx="381.5" cy="156.0" r="10"/>
<rect class="band alt" x="0" y="176" width="960" height="40"/>
<text class="l b" x="10" y="193" text-anchor="start">catalog-manager thread</text>
<text class="l muted" x="10" y="208" text-anchor="start">_ingest: apply a finished job</text>
<circle class="dot held" cx="484.5" cy="196.0" r="10"/>
<circle class="dot brief" cx="587.5" cy="196.0" r="10"/>
<circle class="dot held" cx="690.5" cy="196.0" r="10"/>
<rect class="band" x="0" y="216" width="960" height="40"/>
<text class="l b" x="10" y="233" text-anchor="start">catalog-manager thread</text>
<text class="l muted" x="10" y="248" text-anchor="start">every 30 s: _recover_finished</text>
<circle class="dot brief" cx="587.5" cy="236.0" r="10"/>
<circle class="dot held" cx="484.5" cy="236.0" r="10"/>
<circle class="dot held" cx="690.5" cy="236.0" r="10"/>
<rect class="band alt" x="0" y="256" width="960" height="40"/>
<text class="l b" x="10" y="273" text-anchor="start">Admin command thread</text>
<text class="l muted" x="10" y="288" text-anchor="start">catalog search and status</text>
<circle class="dot brief" cx="690.5" cy="276.0" r="10"/>
<rect class="band" x="0" y="296" width="960" height="40"/>
<text class="l b" x="10" y="313" text-anchor="start">Download thread</text>
<text class="l muted" x="10" y="328" text-anchor="start">BEFORE_JOB_DOWNLOAD: scrub a copy</text>
<rect class="band alt" x="0" y="336" width="960" height="40"/>
<text class="l b" x="10" y="353" text-anchor="start">Job process</text>
<text class="l muted" x="10" y="368" text-anchor="start">controller: record a site's reply</text>
<circle class="dot brief" cx="896.5" cy="356.0" r="10"/>
<rect class="band" x="0" y="376" width="960" height="40"/>
<text class="l b" x="10" y="393" text-anchor="start">Job process</text>
<text class="l muted" x="10" y="408" text-anchor="start">controller: write the manifest</text>
<circle class="dot held" cx="793.5" cy="396.0" r="10"/>
<circle class="dot brief" cx="896.5" cy="396.0" r="10"/>
<circle class="dot held" cx="20" cy="440" r="8"/><text class="l" x="36" y="444" text-anchor="start">held across disk work</text>
<circle class="dot brief" cx="250" cy="440" r="8"/><text class="l" x="266" y="444" text-anchor="start">held briefly, in memory only</text>
<text class="l muted" x="10" y="468" text-anchor="start">_result_lock is taken before _lock or store.lock. _lock and store.lock are never held together.</text>
</svg>
