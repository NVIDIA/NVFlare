<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 366" width="1000" height="366" role="img" aria-labelledby="t d">
<title id="t">How a result is trusted</title><desc id="d">Only the server holds the master key. A job gets one derived key and signs its manifest; the server derives the key again and verifies the signature before applying anything.</desc>
<style>
:root { --bg:#fbfcfb; --zone:#f0f3f2; --surface:#ffffff; --ink:#1b2422; --muted:#5a6764; --line:#b9c4c0;
  --accent:#0b6e67; --accent-tint:#d7ece9; --warn:#8f5400; --warn-tint:#f5e5c6; }
@media (prefers-color-scheme: dark) { :root { --bg:#14191a; --zone:#1b2322; --surface:#202928; --ink:#e3eae7;
  --muted:#9aa7a3; --line:#3b4845; --accent:#55c7bb; --accent-tint:#17332f; --warn:#e5a94c; --warn-tint:#3a2f17; } }
.bg { fill:var(--bg); }
.zone { fill:var(--zone); stroke:var(--line); stroke-width:1.2; }
.box { fill:var(--surface); stroke:var(--line); stroke-width:1.3; }
.box.a { fill:var(--accent-tint); stroke:var(--accent); }
.box.w { fill:var(--warn-tint); stroke:var(--warn); }
.cell { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.cell.good { fill:var(--accent-tint); stroke:var(--accent); }
.cell.warn { fill:var(--warn-tint); stroke:var(--warn); }
text { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--ink); }
.b { font-weight:600; }
.m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.l { font-size:12px; }
.s { font-size:11.5px; }
.muted { fill:var(--muted); }
.warnt { fill:var(--warn); }
.zt { font-size:12px; font-weight:600; letter-spacing:0.06em; fill:var(--muted); }
.arr { fill:none; stroke:var(--muted); stroke-width:1.6; }
.arr.d { stroke-dasharray:5 4; }
.head { fill:var(--muted); }
.brace { stroke:var(--muted); stroke-width:1.2; fill:none; }
.band { fill:transparent; }
.band.alt { fill:var(--zone); opacity:0.7; }
.dot.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:2; }
.dot.brief { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.bar.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:1.2; }
.bar.brief { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
.bar.none { fill:var(--surface); stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 3; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="366" rx="10"/>
<rect class="box" x="10" y="30" width="180" height="72" rx="7"/>
<text class="b" x="100.0" y="62.0" text-anchor="middle">Server master key</text>
<text class="" x="100.0" y="79.0" text-anchor="middle">never leaves the server</text>
<polyline class="arr" points="190,66 210,66" marker-end="url(#ah)"/>
<rect class="box a" x="210" y="30" width="180" height="72" rx="7"/>
<text class="b" x="300.0" y="53.5" text-anchor="middle">Job key</text>
<text class="" x="300.0" y="70.5" text-anchor="middle">derived from the master key</text>
<text class="" x="300.0" y="87.5" text-anchor="middle">and the job id</text>
<polyline class="arr" points="390,66 410,66" marker-end="url(#ah)"/>
<rect class="box" x="410" y="30" width="180" height="72" rx="7"/>
<text class="b" x="500.0" y="62.0" text-anchor="middle">catalog_context.json</text>
<text class="" x="500.0" y="79.0" text-anchor="middle">in the run directory</text>
<polyline class="arr" points="590,66 610,66" marker-end="url(#ah)"/>
<rect class="box a" x="610" y="30" width="180" height="72" rx="7"/>
<text class="b" x="700.0" y="53.5" text-anchor="middle">CatalogController</text>
<text class="" x="700.0" y="70.5" text-anchor="middle">signs the manifest</text>
<text class="" x="700.0" y="87.5" text-anchor="middle">with the job key</text>
<polyline class="arr" points="790,66 810,66" marker-end="url(#ah)"/>
<rect class="box" x="810" y="30" width="180" height="72" rx="7"/>
<text class="b" x="900.0" y="62.0" text-anchor="middle">catalog_results.json</text>
<text class="" x="900.0" y="79.0" text-anchor="middle">manifest and MAC</text>
<rect class="box w" x="210" y="124" width="360" height="46" rx="7"/>
<text class="b" x="390.0" y="143.0" text-anchor="middle">Admission check comes first</text>
<text class="" x="390.0" y="160.0" text-anchor="middle">built-in controller only, no custom server code</text>
<polyline class="arr d" points="300,124 300,102" marker-end="url(#ah)"/>
<polyline class="arr" points="910,102 910,214" marker-end="url(#ah)"/>
<text class="l s" x="902" y="160" text-anchor="end">copied at archive</text>
<rect class="box" x="810" y="214" width="180" height="60" rx="7"/>
<text class="b" x="900.0" y="248.5" text-anchor="middle">Parent-only inbox</text>
<rect class="box a" x="560" y="214" width="220" height="60" rx="7"/>
<text class="b" x="670.0" y="240.0" text-anchor="middle">Server re-derives the key</text>
<text class="" x="670.0" y="257.0" text-anchor="middle">and verifies the MAC</text>
<polyline class="arr" points="810,244 780,244" marker-end="url(#ah)"/>
<rect class="box a" x="300" y="214" width="220" height="60" rx="7"/>
<text class="b" x="410.0" y="248.5" text-anchor="middle">valid: apply</text>
<rect class="box w" x="300" y="300" width="220" height="46" rx="7"/>
<text class="b" x="410.0" y="319.0" text-anchor="middle">missing or invalid: discard</text>
<text class="" x="410.0" y="336.0" text-anchor="middle">and log, no health change</text>
<polyline class="arr" points="560,244 520,244" marker-end="url(#ah)"/>
<polyline class="arr" points="620,274 620,323 520,323" marker-end="url(#ah)"/>
<polyline class="arr" points="100,102 100,190 670,190 670,214" marker-end="url(#ah)"/>
<text class="l s" x="380" y="184" text-anchor="middle">same master key, derived again</text>
</svg>
