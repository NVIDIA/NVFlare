<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1190" viewBox="0 0 1260 1190" role="img" aria-labelledby="title desc">
  <title id="title">Compose your FLARE certificate deployment</title>
  <desc id="desc">Three independently selectable credential sources share one trusted root. Purple denotes admin credentials, blue endpoint credentials, and teal the server job CA. Admins can use FLARE-issued files, SSO, or IT-supplied files. Endpoints and the job CA can each use FLARE-issued or externally supplied credentials. The built-in job CA remains inside the FLARE server and issues per-job credentials in every combination. Public-trust-only provisioning requires external sources for all three credential categories.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616f"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172638;font-size:22px}
      .heading{font-size:32px;font-weight:700}
      .label{font-size:25px;font-weight:700}
      .small{font-size:20px}
      .muted{fill:#4b5b6a}
      .rule{stroke:#c6ced6;stroke-width:1.5}
      .arrow{stroke:#52616f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .node{fill:#fff;stroke:#97a6b4;stroke-width:1.5}
      .purple{fill:#eee7f9}
      .blue{fill:#e3effb}
      .teal{fill:#e0f2ed}
    </style>
  </defs>
  <rect width="1260" height="1190" fill="#fff"/>
  <text x="36" y="48" class="heading">Compose your FLARE certificate deployment</text>
  <text x="36" y="84" class="muted">Choose a source in each colored lane. These are choices, not rollout stages.</text>

  <rect x="36" y="111" width="1188" height="89" rx="8" fill="#f1f4f7"/>
  <text x="59" y="145" class="label">Root CA</text>
  <text x="190" y="145">Choose one trusted root for the federation.</text>
  <rect x="59" y="157" width="260" height="33" rx="5" class="node"/>
  <text x="189" y="181" text-anchor="middle">FLARE-managed</text>
  <text x="346" y="181" text-anchor="middle" class="small">OR</text>
  <rect x="376" y="157" width="300" height="33" rx="5" class="node"/>
  <text x="526" y="181" text-anchor="middle">Enterprise-managed</text>
  <text x="710" y="181" class="small">All certificate chains reach this root.</text>

  <rect x="36" y="224" width="380" height="459" rx="10" class="purple"/>
  <rect x="440" y="224" width="380" height="459" rx="10" class="blue"/>
  <rect x="844" y="224" width="380" height="459" rx="10" class="teal"/>
  <text x="57" y="260" class="label">Admin credentials</text>
  <text x="461" y="260" class="label">Server / site credentials</text>
  <text x="865" y="260" class="label">Server job-CA credential</text>

  <rect x="57" y="283" width="338" height="87" rx="6" class="node"/>
  <text x="76" y="315">FLARE-issued certificate</text>
  <text x="76" y="346" class="small muted">Delivered in the admin kit</text>
  <text x="226" y="399" text-anchor="middle" class="small">OR</text>
  <rect x="57" y="413" width="338" height="87" rx="6" class="node"/>
  <text x="76" y="445">SSO-issued certificate</text>
  <text x="76" y="476" class="small muted">External IdP + certificate service</text>
  <text x="226" y="529" text-anchor="middle" class="small">OR</text>
  <rect x="57" y="543" width="338" height="87" rx="6" class="node"/>
  <text x="76" y="575">IT-supplied certificate files</text>
  <text x="76" y="606" class="small muted">External credential source</text>
  <text x="57" y="659" class="small">SSO and file-based admins can coexist.</text>

  <rect x="461" y="283" width="338" height="87" rx="6" class="node"/>
  <text x="480" y="315">FLARE-issued certificate</text>
  <text x="480" y="346" class="small muted">Delivered in the endpoint kit</text>
  <text x="630" y="399" text-anchor="middle" class="small">OR</text>
  <rect x="461" y="413" width="338" height="87" rx="6" class="node"/>
  <text x="480" y="445">IT-supplied certificate files</text>
  <text x="480" y="476" class="small muted">External CA + installation tooling</text>
  <text x="461" y="548" class="small">Choose per endpoint.</text>
  <text x="461" y="579" class="small">IT manages replacement and</text>
  <text x="461" y="609" class="small">restart for external credentials.</text>

  <rect x="865" y="283" width="338" height="87" rx="6" class="node"/>
  <text x="884" y="315">FLARE-issued job CA</text>
  <text x="884" y="346" class="small muted">Delivered in the server kit</text>
  <text x="1034" y="399" text-anchor="middle" class="small">OR</text>
  <rect x="865" y="413" width="338" height="87" rx="6" class="node"/>
  <text x="884" y="445">IT-supplied job-CA files</text>
  <text x="884" y="476" class="small muted">External CA + installation tooling</text>
  <text x="865" y="548" class="small">The issuer must be allowed</text>
  <text x="865" y="579" class="small">to issue a subordinate CA.</text>
  <text x="865" y="624" class="small muted">Separate from the server TLS identity.</text>

  <path class="arrow" d="M226 683V719"/>
  <path class="arrow" d="M630 683V719"/>
  <path class="arrow" d="M1034 683V719"/>
  <rect x="36" y="728" width="380" height="105" rx="8" class="purple"/>
  <text x="57" y="761" class="label">FLARE admin client</text>
  <text x="57" y="792" class="small">Private key stays with the admin.</text>
  <text x="57" y="821" class="small">Authenticates users and signs jobs.</text>
  <rect x="440" y="728" width="380" height="105" rx="8" class="blue"/>
  <text x="461" y="761" class="label">FLARE server / site client</text>
  <text x="461" y="792" class="small">Private key stays at the endpoint.</text>
  <text x="461" y="821" class="small">Authenticates network connections.</text>
  <rect x="844" y="728" width="380" height="176" rx="8" fill="#f5f7f8" stroke="#97a6b4" stroke-width="1.5"/>
  <text x="865" y="760" class="label">Inside the FLARE server</text>
  <rect x="865" y="776" width="338" height="109" rx="6" class="teal"/>
  <text x="884" y="808" class="label">Built-in job CA</text>
  <text x="884" y="838" class="small">Signing key stays on the server.</text>
  <text x="884" y="869" class="small">Issues fresh per-job credentials.</text>

  <path class="arrow" d="M1034 904V941"/>
  <rect x="844" y="950" width="380" height="74" rx="8" class="teal"/>
  <text x="865" y="980">Server + site job processes</text>
  <text x="865" y="1009" class="small">A separate key for each job process</text>

  <text x="36" y="886" class="label">One valid combination</text>
  <rect x="36" y="906" width="106" height="38" rx="5" class="purple"/>
  <text x="89" y="932" text-anchor="middle">SSO</text>
  <text x="155" y="932">+</text>
  <rect x="185" y="906" width="284" height="38" rx="5" class="blue"/>
  <text x="327" y="932" text-anchor="middle">FLARE-issued endpoints</text>
  <text x="483" y="932">+</text>
  <rect x="513" y="906" width="307" height="38" rx="5" class="teal"/>
  <text x="666" y="932" text-anchor="middle">FLARE-issued job CA</text>
  <text x="36" y="980" class="small">Same trusted root. No change to local per-job issuance.</text>

  <rect x="36" y="1053" width="1188" height="107" rx="8" fill="#fff0dd"/>
  <text x="57" y="1087" class="label">Optional: public-trust-only provisioning</text>
  <text x="57" y="1120">Requires SSO or IT-supplied admin files + external endpoint files + external job-CA files.</text>
  <text x="57" y="1148" class="small">Provisioning receives the public root only. The server still holds its job-CA key and issues per-job credentials.</text>
</svg>
