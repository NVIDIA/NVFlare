<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
<title id="t">How a search is answered</title><desc id="d">Authorization, a snapshot of client states, a cache keyed on the exact state object, then filter, order, facets, cursor and page.</desc>
<style>
:root { --bg:#fbfcfb; --zone:#f0f3f2; --surface:#ffffff; --ink:#1b2422; --muted:#5a6764; --line:#b9c4c0;
  --accent:#0b6e67; --accent-tint:#d7ece9; --warn:#8f5400; --warn-tint:#f5e5c6; }
@media (prefers-color-scheme: dark) { :root { --bg:#14191a; --zone:#1b2322; --surface:#202928; --ink:#e3eae7;
  --muted:#9aa7a3; --line:#3b4845; --accent:#55c7bb; --accent-tint:#17332f; --warn:#e5a94c; --warn-tint:#3a2f17; } }
.bg { fill:var(--bg); }
.zone { fill:var(--zone); stroke:var(--line); stroke-width:1.2; }
.box { fill:var(--surface); stroke:var(--line); stroke-width:1.3; }
.box.a { fill:var(--accent-tint); stroke:var(--accent); }
.box.w { fill:var(--warn-tint); stroke:var(--warn); }
.cell { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.cell.good { fill:var(--accent-tint); stroke:var(--accent); }
.cell.warn { fill:var(--warn-tint); stroke:var(--warn); }
text { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--ink); }
.b { font-weight:600; }
.m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.l { font-size:12px; }
.s { font-size:11.5px; }
.muted { fill:var(--muted); }
.warnt { fill:var(--warn); }
.zt { font-size:12px; font-weight:600; letter-spacing:0.06em; fill:var(--muted); }
.arr { fill:none; stroke:var(--muted); stroke-width:1.6; }
.arr.d { stroke-dasharray:5 4; }
.head { fill:var(--muted); }
.brace { stroke:var(--muted); stroke-width:1.2; fill:none; }
.band { fill:transparent; }
.band.alt { fill:var(--zone); opacity:0.7; }
.dot.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:2; }
.dot.brief { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.bar.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:1.2; }
.bar.brief { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
.bar.none { fill:var(--surface); stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 3; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="280" rx="10"/>
<rect class="box" x="10" y="55" width="150" height="60" rx="7"/>
<text class="" x="85.0" y="81.0" text-anchor="middle">Check the user's</text>
<text class="" x="85.0" y="98.0" text-anchor="middle">Study authorization</text>
<rect class="box" x="185" y="55" width="150" height="60" rx="7"/>
<text class="" x="260.0" y="81.0" text-anchor="middle">Snapshot the Study's</text>
<text class="" x="260.0" y="98.0" text-anchor="middle">client states</text>
<rect class="box" x="360" y="55" width="200" height="60" rx="7"/>
<text class="" x="460.0" y="81.0" text-anchor="middle">Cached entries for</text>
<text class="" x="460.0" y="98.0" text-anchor="middle">this exact client state?</text>
<rect class="box a" x="600" y="5" width="350" height="50" rx="7"/>
<text class="b" x="775.0" y="34.5" text-anchor="middle">Reuse the cached entries</text>
<rect class="box" x="600" y="75" width="350" height="76" rx="7"/>
<text class="b" x="775.0" y="100.5" text-anchor="middle">Build entries, then cache them</text>
<text class="" x="775.0" y="117.5" text-anchor="middle">skip withheld, no metadata for unavailable</text>
<text class="" x="775.0" y="134.5" text-anchor="middle">drop withheld datasets from lineage</text>
<polyline class="arr" points="950,30 958,30 958,176 775,176"/>
<polyline class="arr" points="160,85 185,85" marker-end="url(#ah)"/>
<polyline class="arr" points="335,85 360,85" marker-end="url(#ah)"/>
<polyline class="arr" points="560,72 600,30" marker-end="url(#ah)"/>
<text class="l s" x="575" y="40" text-anchor="middle">yes</text>
<polyline class="arr" points="560,98 600,112" marker-end="url(#ah)"/>
<text class="l s" x="575" y="128" text-anchor="middle">no</text>
<polyline class="arr" points="775,151 775,176 95,176 95,196" marker-end="url(#ah)"/>
<text class="l s" x="105" y="170" text-anchor="start">every visible entry of the Study (withheld removed)</text>
<rect class="box" x="10" y="196" width="170" height="66" rx="7"/>
<text class="b" x="95.0" y="216.5" text-anchor="middle">Filter</text>
<text class="" x="95.0" y="233.5" text-anchor="middle">client, dataset, available,</text>
<text class="" x="95.0" y="250.5" text-anchor="middle">metadata filters</text>
<rect class="box" x="205" y="196" width="150" height="66" rx="7"/>
<text class="b" x="280.0" y="225.0" text-anchor="middle">Order</text>
<text class="" x="280.0" y="242.0" text-anchor="middle">by client, then dataset</text>
<rect class="box" x="380" y="196" width="190" height="66" rx="7"/>
<text class="b" x="475.0" y="225.0" text-anchor="middle">Facets and total</text>
<text class="" x="475.0" y="242.0" text-anchor="middle">over all matches</text>
<rect class="box" x="595" y="196" width="190" height="66" rx="7"/>
<text class="b" x="690.0" y="216.5" text-anchor="middle">Cursor</text>
<text class="" x="690.0" y="233.5" text-anchor="middle">continue after the last key</text>
<text class="" x="690.0" y="250.5" text-anchor="middle">must match the filters</text>
<rect class="box a" x="810" y="196" width="140" height="66" rx="7"/>
<text class="b" x="880.0" y="225.0" text-anchor="middle">One page</text>
<text class="" x="880.0" y="242.0" text-anchor="middle">and the next cursor</text>
<polyline class="arr" points="180,229 205,229" marker-end="url(#ah)"/>
<polyline class="arr" points="355,229 380,229" marker-end="url(#ah)"/>
<polyline class="arr" points="570,229 595,229" marker-end="url(#ah)"/>
<polyline class="arr" points="785,229 810,229" marker-end="url(#ah)"/>
</svg>
