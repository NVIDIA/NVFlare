<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 420" width="810" height="420" role="img" aria-labelledby="t d">
<title id="t">Connectors</title><desc id="d">Five built-in connectors implement the CatalogConnector interface. Each is selected by the dataset type in the site dataset configuration; a site can declare more.</desc>
<style>
:root { --bg:#fbfcfb; --zone:#f0f3f2; --surface:#ffffff; --ink:#1b2422; --muted:#5a6764; --line:#b9c4c0;
  --accent:#0b6e67; --accent-tint:#d7ece9; --warn:#8f5400; --warn-tint:#f5e5c6; }
@media (prefers-color-scheme: dark) { :root { --bg:#14191a; --zone:#1b2322; --surface:#202928; --ink:#e3eae7;
  --muted:#9aa7a3; --line:#3b4845; --accent:#55c7bb; --accent-tint:#17332f; --warn:#e5a94c; --warn-tint:#3a2f17; } }
.bg { fill:var(--bg); }
.zone { fill:var(--zone); stroke:var(--line); stroke-width:1.2; }
.box { fill:var(--surface); stroke:var(--line); stroke-width:1.3; }
.box.a { fill:var(--accent-tint); stroke:var(--accent); }
.box.w { fill:var(--warn-tint); stroke:var(--warn); }
.cell { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.cell.good { fill:var(--accent-tint); stroke:var(--accent); }
.cell.warn { fill:var(--warn-tint); stroke:var(--warn); }
text { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--ink); }
.b { font-weight:600; }
.m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
.l { font-size:12px; }
.s { font-size:11.5px; }
.muted { fill:var(--muted); }
.warnt { fill:var(--warn); }
.zt { font-size:12px; font-weight:600; letter-spacing:0.06em; fill:var(--muted); }
.arr { fill:none; stroke:var(--muted); stroke-width:1.6; }
.arr.d { stroke-dasharray:5 4; }
.head { fill:var(--muted); }
.brace { stroke:var(--muted); stroke-width:1.2; fill:none; }
.band { fill:transparent; }
.band.alt { fill:var(--zone); opacity:0.7; }
.dot.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:2; }
.dot.brief { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.bar.held { fill:var(--warn-tint); stroke:var(--warn); stroke-width:1.2; }
.bar.brief { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
.bar.none { fill:var(--surface); stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 3; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="bg" x="0" y="0" width="810" height="420" rx="10"/>
<rect class="box a" x="242" y="20" width="320" height="92" rx="7"/>
<text class="b" x="402" y="45" text-anchor="middle">CatalogConnector (interface)</text>
<text class="m" x="402" y="62" text-anchor="middle">source</text>
<text class="m" x="402" y="79" text-anchor="middle">read_catalog(dataset, secret, limits)</text>
<text class="m" x="402" y="96" text-anchor="middle">close()</text>
<line class="brace" x1="402" y1="160" x2="402" y2="112"/>
<text class="l s" x="412" y="140" text-anchor="start">implement the interface</text>
<line class="brace" x1="86" y1="160" x2="718" y2="160"/>
<rect class="box" x="10" y="200" width="152" height="54" rx="7"/><text class="b" x="86" y="231.5" text-anchor="middle">ParquetConnector</text>
<rect class="box" x="168" y="200" width="152" height="54" rx="7"/><text class="b" x="244" y="231.5" text-anchor="middle">CSVConnector</text>
<rect class="box" x="326" y="200" width="152" height="54" rx="7"/><text class="b" x="402" y="231.5" text-anchor="middle">SQLConnector</text>
<rect class="box" x="484" y="200" width="152" height="54" rx="7"/><text class="b" x="560" y="231.5" text-anchor="middle">DuckDBConnector</text>
<rect class="box" x="642" y="200" width="152" height="54" rx="7"/><text class="b" x="718" y="231.5" text-anchor="middle">UnityCatalogConnector</text>
<line class="brace" x1="86" y1="200" x2="86" y2="160"/>
<line class="brace" x1="244" y1="200" x2="244" y2="160"/>
<line class="brace" x1="402" y1="200" x2="402" y2="160"/>
<line class="brace" x1="560" y1="200" x2="560" y2="160"/>
<line class="brace" x1="718" y1="200" x2="718" y2="160"/>
<text class="zt" x="10" y="372">ABOVE: SELECTED BY THE DATASET TYPE IN THE SITE DATASET CONFIGURATION</text>
<rect class="box w" x="10" y="296" width="152" height="54" rx="7"/><text class="m" x="86" y="319" text-anchor="middle">type: parquet</text><text class="" x="86" y="337" text-anchor="middle">file URI</text>
<rect class="box w" x="168" y="296" width="152" height="54" rx="7"/><text class="m" x="244" y="319" text-anchor="middle">type: csv</text><text class="" x="244" y="337" text-anchor="middle">file URI</text>
<rect class="box w" x="326" y="296" width="152" height="54" rx="7"/><text class="m" x="402" y="319" text-anchor="middle">type: sql</text><text class="" x="402" y="337" text-anchor="middle">file URI or database URL</text>
<rect class="box w" x="484" y="296" width="152" height="54" rx="7"/><text class="m" x="560" y="319" text-anchor="middle">type: duckdb</text><text class="" x="560" y="337" text-anchor="middle">file URI; site class</text>
<rect class="box w" x="642" y="296" width="152" height="54" rx="7"/><text class="m" x="718" y="319" text-anchor="middle">type:</text><text class="m" x="718" y="337" text-anchor="middle">unity-catalog</text>
<polyline class="arr" points="86,296 86,254" marker-end="url(#ah)"/>
<polyline class="arr" points="244,296 244,254" marker-end="url(#ah)"/>
<polyline class="arr" points="402,296 402,254" marker-end="url(#ah)"/>
<polyline class="arr" points="560,296 560,254" marker-end="url(#ah)"/>
<polyline class="arr" points="718,296 718,254" marker-end="url(#ah)"/>
<text class="l muted" x="10" y="402" text-anchor="start">Amber boxes are owned by the site. A site adds a connector by declaring its class; a dataset's rules may select it.</text>
</svg>
