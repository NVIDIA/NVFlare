<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title description">
  <title id="title">Two authorization layers in confidential federation</title>
  <desc id="description">Trusted preparation supplies approved artifacts and policies. Trustee appraises evidence and separately authorizes keys or resources delivered to the protected guest. The guest runs a CVM vault or CoCo encrypted-image workload inside an untrusted host. NVFlare peers separately exchange identity-bound proofs over TLS; their participant checks do not release workload keys.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243746; }
      .title { font-size: 20px; font-weight: 700; }
      .heading { font-size: 17px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #52647a; }
      .trusted { fill: #eff5fc; stroke: #7996b5; }
      .guest { fill: #eef8ef; stroke: #639566; }
      .host { fill: #fff7f4; stroke: #b67868; stroke-dasharray: 5 4; }
      .owner { fill: #fff9e9; stroke: #b79a56; }
      .arrow, .peer, .dataset { fill: none; stroke: #52647a; stroke-width: 1.5; marker-end: url(#arrow); }
      .peer { marker-start: url(#arrow); }
      .dataset { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="640" height="450" fill="#fff"/>
  <text x="20" y="28" class="title" text-anchor="start">Two checks protect different boundaries</text>
  <rect x="20" y="48" width="600" height="66" rx="8" class="trusted"/>
  <text x="40" y="74" class="heading" text-anchor="start">Trusted preparation</text>
  <text x="40" y="98" class="body" text-anchor="start">Reviewed workload, approved platform references, release policy</text>
  <path d="M150 114 V160" class="arrow"/>
  <text x="164" y="143" class="small" text-anchor="start">Policies</text>
  <path d="M490 114 V160" class="arrow"/>
  <text x="504" y="143" class="small" text-anchor="start">Artifacts</text>
  <rect x="20" y="160" width="260" height="154" rx="8" class="trusted"/>
  <text x="36" y="190" class="heading" text-anchor="start">Trustee: KBS + AS + RVPS</text>
  <text x="36" y="221" class="small" text-anchor="start">Appraise CPU (+ required GPU)</text>
  <text x="36" y="251" class="body" text-anchor="start">Authorize exact resources</text>
  <text x="36" y="286" class="heading" text-anchor="start">1. Workload key release</text>
  <rect x="350" y="160" width="270" height="154" rx="8" class="host"/>
  <text x="365" y="181" class="small" text-anchor="start">Untrusted host / cluster</text>
  <rect x="370" y="192" width="230" height="102" rx="8" class="guest"/>
  <text x="385" y="216" class="heading" text-anchor="start">Confidential guest</text>
  <text x="385" y="245" class="body" text-anchor="start">CVM vault / CoCo image</text>
  <text x="385" y="274" class="body" text-anchor="start">Approved application</text>
  <path d="M370 223 H280" class="arrow"/>
  <text x="324" y="212" class="small" text-anchor="middle">Evidence</text>
  <path d="M280 274 H370" class="arrow"/>
  <text x="324" y="263" class="small" text-anchor="middle">Key</text>
  <path d="M490 314 V356" class="peer"/>
  <text x="40" y="340" class="small" text-anchor="start">Identity-bound peer proofs over TLS</text>
  <rect x="20" y="356" width="600" height="72" rx="8" class="trusted"/>
  <text x="40" y="383" class="heading" text-anchor="start">2. NVFlare participant verification</text>
  <text x="40" y="410" class="body" text-anchor="start">CCManager + TrusteeAuthorizer check the required peers</text>
</svg>
