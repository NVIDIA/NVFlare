{
  "format_version": 2,
  "app_script": "train.py",
  "app_config": "",
  "model_class_path": "net.Net",
  "executors": [
    {
      "tasks": [
        "train",
        "validate",
        "submit_model"
      ],
      "executor": {
        "path": "nvflare.app_common.executors.client_api_executor.ClientAPIExecutor",
        "args": {
          "execution_mode": "external_process",
          "params_exchange_format": "pytorch",
          "server_expected_format": "numpy",
          "params_transfer_type": "FULL",
          "train_with_evaluation": true,
          "train_task_name": "train",
          "evaluate_task_name": "validate",
          "submit_model_task_name": "submit_model",
          "command": "python3 custom/{app_script}  {app_config} ",
          "launch_once": true
        }
      }
    },
    {
      "tasks": [
        "wf_*"
      ],
      "executor": {
        "id": "client_controller_executor",
        "path": "nvflare.app_common.ccwf.client_controller_executor.ClientControllerExecutor",
        "args": {
          "controller_id_list": [
            "sag_ctl",
            "cse_ctl"
          ],
          "task_name_prefix": "wf",
          "persistor_id": "persistor"
        }
      }
    }
  ],
  "task_data_filters": [],
  "task_result_filters": [],
  "components": [
    {
      "id": "sag_ctl",
      "path": "nvflare.app_common.workflows.scatter_and_gather.ScatterAndGather",
      "args": {
        "min_clients": 2,
        "num_rounds": 3,
        "start_round": 0,
        "wait_time_after_min_received": 0,
        "aggregator_id": "aggregator",
        "persistor_id": "persistor",
        "shareable_generator_id": "shareable_generator",
        "train_task_name": "train",
        "train_timeout": 0
      }
    },
    {
      "id": "cse_ctl",
      "path": "nvflare.app_common.workflows.cross_site_model_eval.CrossSiteModelEval",
      "args": {
        "model_locator_id": "model_locator",
        "submit_model_timeout": 600,
        "validation_timeout": 6000,
        "cleanup_models": false
      }
    },
    {
      "id": "persistor",
      "path": "nvflare.app_opt.pt.file_model_persistor.PTFileModelPersistor",
      "args": {
        "model": {
          "path": "{model_class_path}"
        }
      }
    },
    {
      "id": "shareable_generator",
      "path": "nvflare.app_common.shareablegenerators.full_model_shareable_generator.FullModelShareableGenerator",
      "args": {}
    },
    {
      "id": "aggregator",
      "path": "nvflare.app_common.aggregators.intime_accumulate_model_aggregator.InTimeAccumulateWeightedAggregator",
      "args": {
        "expected_data_kind": "WEIGHTS"
      }
    },
    {
      "id": "model_locator",
      "path": "nvflare.app_opt.pt.file_model_locator.PTFileModelLocator",
      "args": {
        "pt_persistor_id": "persistor"
      }
    },
    {
      "id": "model_selector",
      "path": "nvflare.app_common.widgets.intime_model_selector.IntimeModelSelector",
      "args": {
        "key_metric": "accuracy"
      }
    },
    {
      "id": "json_generator",
      "path": "nvflare.app_common.widgets.validation_json_generator.ValidationJsonGenerator",
      "args": {}
    }
  ]
}
