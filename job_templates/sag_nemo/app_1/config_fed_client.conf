{
  "format_version": 2,
  "app_script": "megatron_gpt_peft_tuning.py",
  "app_config": "",
  "ddp_config": "--nnodes=1 --nproc_per_node=1 --master_port=7777",
  "executors": [
    {
      "tasks": [
        "train"
      ],
      "executor": {
        "path": "nvflare.app_common.executors.client_api_executor.ClientAPIExecutor",
        "args": {
          "execution_mode": "external_process",
          "params_exchange_format": "pytorch",
          "server_expected_format": "numpy",
          "params_transfer_type": "DIFF",
          "train_with_evaluation": true,
          "command": "python3 -m torch.distributed.run {ddp_config} custom/{app_script} {app_config} ",
          "launch_once": true
        }
      }
    }
  ],
  "task_data_filters": [],
  "task_result_filters": [],
  "components": []
}
