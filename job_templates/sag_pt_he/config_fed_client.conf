{
  "format_version": 2,
  "app_script": "train.py",
  "app_config": "",
  "executors": [
    {
      "tasks": [
        "train"
      ],
      "executor": {
        "path": "nvflare.app_common.executors.client_api_executor.ClientAPIExecutor",
        "args": {
          "execution_mode": "external_process",
          "params_exchange_format": "pytorch",
          "server_expected_format": "numpy",
          "params_transfer_type": "DIFF",
          "train_with_evaluation": true,
          "command": "python3 -u custom/{app_script}  {app_config} ",
          "launch_once": true
        }
      }
    }
  ],
  "task_data_filters": [
    {
      "tasks": [
        "train"
      ],
      "filters": [
        {
          "path": "nvflare.app_opt.he.model_decryptor.HEModelDecryptor",
          "args": {}
        }
      ]
    }
  ],
  "task_result_filters": [
    {
      "tasks": [
        "train"
      ],
      "filters": [
        {
          "path": "nvflare.app_opt.he.model_encryptor.HEModelEncryptor",
          "args": {
            "weigh_by_local_iter": true
          }
        }
      ]
    }
  ],
  "components": []
}
