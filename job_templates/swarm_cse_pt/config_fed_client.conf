{
  "format_version": 2,
  "app_script": "train.py",
  "app_config": "",
  "executors": [
    {
      "tasks": [
        "train",
        "validate",
        "submit_model"
      ],
      "executor": {
        "id": "Executor",
        "path": "nvflare.app_common.executors.client_api_executor.ClientAPIExecutor",
        "args": {
          "execution_mode": "external_process",
          "params_exchange_format": "pytorch",
          "server_expected_format": "numpy",
          "params_transfer_type": "FULL",
          "train_with_evaluation": true,
          "train_task_name": "train",
          "evaluate_task_name": "validate",
          "submit_model_task_name": "submit_model",
          "command": "python3 -u custom/{app_script}  {app_config} ",
          "launch_once": true
        }
      }
    },
    {
      "tasks": [
        "swarm_*"
      ],
      "executor": {
        "path": "nvflare.app_common.ccwf.SwarmClientController",
        "args": {
          "learn_task_name": "train",
          "learn_task_timeout": 600,
          "persistor_id": "persistor",
          "aggregator_id": "aggregator",
          "shareable_generator_id": "shareable_generator",
          "min_responses_required": 2,
          "wait_time_after_min_resps_received": 30
        }
      }
    },
    {
      "tasks": [
        "cse_*"
      ],
      "executor": {
        "path": "nvflare.app_common.ccwf.CrossSiteEvalClientController",
        "args": {
          "submit_model_task_name": "submit_model",
          "validation_task_name": "validate",
          "persistor_id": "persistor",
          "get_model_timeout": 60
        }
      }
    }
  ],
  "task_result_filters": [],
  "task_data_filters": [],
  "components": [
    {
      "id": "persistor",
      "path": "nvflare.app_opt.pt.file_model_persistor.PTFileModelPersistor",
      "args": {
        "model": {
          "path": "net.Net"
        }
      }
    },
    {
      "id": "shareable_generator",
      "path": "nvflare.app_common.ccwf.comps.simple_model_shareable_generator.SimpleModelShareableGenerator",
      "args": {}
    },
    {
      "id": "aggregator",
      "path": "nvflare.app_common.aggregators.intime_accumulate_model_aggregator.InTimeAccumulateWeightedAggregator",
      "args": {
        "expected_data_kind": "WEIGHTS"
      }
    },
    {
      "id": "model_selector",
      "path": "nvflare.app_common.widgets.intime_model_selector.IntimeModelSelector",
      "args": {
        "key_metric": "accuracy"
      }
    },
    {
      "id": "result_printer",
      "path": "nvflare.app_common.ccwf.comps.cwe_result_printer.CWEResultPrinter",
      "args": {}
    }
  ]
}
