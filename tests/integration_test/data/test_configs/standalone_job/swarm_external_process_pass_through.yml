# Secure nested Swarm coverage for external-process Client API pass-through.
# To select only this config:
#   NVFLARE_TEST_FRAMEWORK=client_api pytest -s system_test.py -k swarm_external_process_pass_through
project_yaml: ./data/projects/client_api.yml
jobs_root_dir: ./data/jobs
cleanup: True


tests:
  - test_name: "run swarm-external-process-pass-through"
    event_sequence:
      - "trigger":
          "type": "server_log"
          "data": "Server started"
        "actions": [ "submit_job swarm_external_process_pass_through" ]
        "result":
          "type": "job_submit_success"
      - "trigger":
          "type": "run_state"
          "data": { "run_finished": True }
        "actions": [ "ensure_current_job_done" ]
        "result":
          "type": "run_state"
          "data": { "run_finished": True }
    validators:
      - path: tests.integration_test.src.validators.LogPatternValidator
        args:
          required_patterns:
            - "swarm external trainer sent round 0 result shape=(1024, 1024)"
          forbidden_patterns:
            - "unauthenticated msg"
            - "Traceback (most recent call last)"
            - "EXECUTION_EXCEPTION"
