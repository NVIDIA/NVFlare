# Regression tests for external-process Client API streaming (NVBug 6371056).
# np_loop_external_process is the small-payload launch-once control, while
# pt_large_model_pass_through exercises DownloadService-backed tensors. Both
# jobs use the ClientAPIExecutor external-process backend. This file is the only
# home of these two test cases; test_configs.yml includes it in the client_api
# group so the streaming path runs in the standard Client API integration stage.
# The project is provisioned secure. The large-model case therefore also gates
# post-HELLO site credential delegation to the descendant trainer Cell: a trainer
# missing those auth headers fails the existing "unauthenticated msg" validator.
project_yaml: ./data/projects/client_api.yml
jobs_root_dir: ./data/jobs
cleanup: True


tests:
  - test_name: "run np-loop-external-process"
    event_sequence:
      - "trigger":
          "type": "server_log"
          "data": "Server started"
        "actions": [ "submit_job np_loop_external_process" ]
        "result":
          "type": "job_submit_success"
      - "trigger":
          "type": "run_state"
          "data": { "run_finished": True }
        "actions": [ "ensure_current_job_done" ]
        "result":
          "type": "run_state"
          "data": { "run_finished": True }
  - test_name: "run pt-large-model-pass-through"
    event_sequence:
      - "trigger":
          "type": "server_log"
          "data": "Server started"
        "actions": [ "submit_job pt_large_model_pass_through" ]
        "result":
          "type": "job_submit_success"
      - "trigger":
          "type": "run_state"
          "data": { "run_finished": True }
        "actions": [ "ensure_current_job_done" ]
        "result":
          "type": "run_state"
          "data": { "run_finished": True }
    validators:
      - path: tests.integration_test.src.validators.PTModelValidator
      - path: tests.integration_test.src.validators.LogPatternValidator
        args:
          required_patterns:
            - "round 1 training loss:"
          forbidden_patterns:
            - "Traceback (most recent call last)"
            - "EXECUTION_EXCEPTION"
            - "unauthenticated msg"
