# Regression test for secure external-process result relay in Swarm.
# This is intentionally separate from ext_process_streaming.yml so it can be
# run alone when verifying the failure on an unmodified main branch:
#   NVFLARE_TEST_FRAMEWORK=swarm_external_process_relay pytest -s system_test.py
project_yaml: ./data/projects/client_api.yml
jobs_root_dir: ./data/jobs
cleanup: True


tests:
  - test_name: "run swarm-external-process-relay"
    event_sequence:
      - "trigger":
          "type": "server_log"
          "data": "Server started"
        "actions": [ "submit_job swarm_external_process_relay" ]
        "result":
          "type": "job_submit_success"
      - "trigger":
          "type": "run_state"
          "data": { "run_finished": True }
        "actions": [ "ensure_current_job_done" ]
        "result":
          "type": "run_state"
          "data": { "run_finished": True }
    validators:
      - path: tests.integration_test.src.validators.LogPatternValidator
        args:
          required_patterns:
            - "swarm external trainer sent round 0 result shape=(1024, 1024)"
          forbidden_patterns:
            - "cannot relay LazyDownloadRef because no Cell is available in fobs context"
            - "EXECUTION_EXCEPTION"
