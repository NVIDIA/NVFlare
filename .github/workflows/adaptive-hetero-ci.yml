name: Adaptive heterogeneity research CI

on:
  push:
    branches:
      - feature/heterogeneity-aware-aggregation-5209
    paths:
      - "research/adaptive-hetero-aggregation/**"
      - ".github/workflows/adaptive-hetero-ci.yml"
  workflow_dispatch:

# TEMPORARY formatting mode for the newly added validation files. This is
# returned to read-only validation after this hardening run.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NVFlare and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[PT]"
          python -m pip install pytest black==25.9.0 isort==5.13.2 flake8==7.1.1 scikit-learn

      - name: Auto-format research files once
        run: |
          isort research/adaptive-hetero-aggregation
          black research/adaptive-hetero-aggregation

      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/adaptive-hetero-aggregation
          if ! git diff --cached --quiet; then
            git commit -m "Format extended adaptive heterogeneity validation"
            git push origin HEAD:feature/heterogeneity-aware-aggregation-5209
          fi

      - name: Unit and NVFlare integration tests
        env:
          PYTHONPATH: research/adaptive-hetero-aggregation/src
        run: |
          pytest -q research/adaptive-hetero-aggregation/tests

      - name: Formatting and lint checks
        run: |
          black --check research/adaptive-hetero-aggregation
          isort --check-only research/adaptive-hetero-aggregation
          flake8 research/adaptive-hetero-aggregation --max-line-length=120

      - name: Real NVFlare FedOpt SimEnv smoke run
        env:
          PYTHONPATH: research/adaptive-hetero-aggregation/src
        run: |
          python research/adaptive-hetero-aggregation/nvflare_smoke/job.py \
            --n_clients 3 \
            --num_rounds 2 \
            --train_samples 180 \
            --valid_samples 90 \
            --local_epochs 1

      - name: Real NVIDIA FedCE SimEnv protocol smoke run
        run: |
          python research/adaptive-hetero-aggregation/fedce_smoke/job.py \
            --n_clients 3 \
            --num_rounds 3 \
            --train_samples 180 \
            --valid_samples 90 \
            --local_epochs 1

      - name: Synthetic reproducibility benchmark smoke
        run: |
          python research/adaptive-hetero-aggregation/benchmark.py \
            --samples 6000 \
            --rounds 8 \
            --seeds 7 19 \
            --settings mild severe extreme \
            --methods fedopt adaptive \
            --output /tmp/adaptive-benchmark-smoke.json

      - name: Real-data digits robustness benchmark
        run: |
          python research/adaptive-hetero-aggregation/digits_benchmark.py \
            --rounds 25 \
            --seeds 7 19 31 43 57 \
            --settings mild severe extreme \
            --models linear mlp \
            --methods fedopt adaptive \
            --output /tmp/adaptive-digits-5seed.json
