name: Plugin Package

on:
  pull_request:
    paths:
      - 'plugin.json'
      - 'plugin-card.md'
      - 'PLUGIN.md'
      - 'LICENSE'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.cursor-plugin/**'
      - 'skills/**'
      - 'dev_tools/agent/package_plugin.py'
      - 'dev_tools/agent/plugin_validation/ci_check.py'
      - 'dev_tools/agent/skills/**'
      - 'ci/check_relative_doc_links.py'
      - '.github/workflows/plugin-package.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lightweight validation dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.25.1'
      - name: Download the versioned manifest schema
        run: >-
          curl --fail --location --silent --show-error --max-time 30
          https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          --output "$RUNNER_TEMP/plugin.schema.json"
      - name: Validate package and retained resource integrity
        # The checker verifies the schema checksum before using it. It runs no
        # agents and does not sign, publish, or establish security-scan coverage.
        run: >-
          python -m dev_tools.agent.plugin_validation.ci_check
          --schema "$RUNNER_TEMP/plugin.schema.json"
          --output "$RUNNER_TEMP/plugin-checks"
      - name: Retain package check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-nvflare-package-checks
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/plugin-checks/results.json
            ${{ runner.temp }}/plugin-checks/skill-lint.log
            ${{ runner.temp }}/plugin-checks/candidate/
          if-no-files-found: warn
          retention-days: 14
