name: Example download validation

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Published NVFlare commit or release tag to build and validate'
        required: false
        type: string

permissions:
  contents: read

jobs:
  download-and-run:
    if: github.repository == 'NVIDIA/NVFlare'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.14'
      - name: Build distribution and install in a clean CPU environment
        env:
          NVFL_RELEASE: '1'
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/example-wheels"
          python -m venv "$RUNNER_TEMP/example-env"
          wheels=("$RUNNER_TEMP"/example-wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python "$RUNNER_TEMP/example-env/bin/python" --torch-backend cpu "${wheels[0]}[PT]"
      - name: Fetch the exact example and run its zero-argument job
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/example-cache
        run: |
          revision=$(git rev-parse HEAD)
          python ci/validate_example_download.py \
            --python "$RUNNER_TEMP/example-env/bin/python" \
            --expected-commit "$revision" \
            --output "$RUNNER_TEMP/example-evidence"
      - name: Preserve download, run, metrics, and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-download-evidence
          path: ${{ runner.temp }}/example-evidence
          retention-days: 14
