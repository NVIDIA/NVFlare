name: Deploy to gh-pages

on:
  # Trigger the workflow if any web/** files are modified
  push:
    branches:
      - "main"
      # Release branches, e.g. 2.7, 2.10, 3.0
      - "[0-9]+.[0-9]+"
    paths:
      - 'web/**'
  # Read the Docs publishes docs per release (2.9.0), not per branch (2.9).
  # Refresh deployed release branches daily so their documentation links
  # follow each new release without rebuilding or editing the site.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

env:
  site_path: ./web
  version_path: /

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    # One deploy per branch at a time; different branches deploy independently.
    concurrency:
      group: gh-pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Update version_path for non-main branches
        if: ${{ github.ref_type == 'branch' && github.ref_name != 'main'}}
        run: echo version_path=/version/${{ github.ref_name }}/ >> $GITHUB_ENV

      - name: Checkout your repository
        uses: NVIDIA/spark-rapids-common/checkout@main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '>=22.19.0 <23'
          cache: npm
          cache-dependency-path: "${{ env.site_path }}/package-lock.json"

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.site_path }}

      - name: Build project
        run: npm run build
        env:
          VITE_PUBLIC_GH_BRANCH: ${{ github.ref_name }}
        working-directory: ${{ env.site_path }}

      - name: Point documentation links to the branch's latest release
        if: ${{ github.ref_type == 'branch' && github.ref_name != 'main'}}
        run: >-
          python3 .github/scripts/point_web_docs_to_release.py
          --branch "${{ github.ref_name }}"
          --site-dir "${{ env.site_path }}/dist"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: ${{ env.site_path }}/dist
          target-folder: ${{ env.version_path }}
          clean-exclude: version

  refresh-docs-links:
    # Runs after a manual build so both never push gh-pages at the same time.
    needs: build
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-refresh-docs-links
      cancel-in-progress: false
    steps:
      - name: Checkout your repository
        uses: NVIDIA/spark-rapids-common/checkout@main

      - name: Checkout gh-pages
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: gh-pages
          path: gh-pages

      - name: Point each deployed release branch to its latest release docs
        run: |
          for site_dir in gh-pages/version/*/; do
            python3 .github/scripts/point_web_docs_to_release.py \
              --branch "$(basename "$site_dir")" --site-dir "$site_dir"
          done

      - name: Push updated links
        working-directory: gh-pages
        run: |
          if git diff --quiet; then
            echo "Documentation links are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point release branch pages to their latest release docs"
          # A branch deploy may push gh-pages meanwhile; rebase onto it and retry.
          for attempt in 1 2 3; do
            git push origin gh-pages && exit 0
            git pull --rebase origin gh-pages
          done
          exit 1
