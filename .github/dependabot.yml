version: 2
updates:
  # GR00T evaluation is a tested Python 3.10 / Isaac-GR00T environment freeze.
  # Keep its exact versions together; upgrade and revalidate the stack manually.
  # setup_groot_eval.sh also pins torch==2.7.1 and torchvision==0.22.1 (+cu128).
  - package-ecosystem: pip
    directory: /research/decent-vla/scripts
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        versions: [">=0"]
  - package-ecosystem: uv
    directory: /research/decent-vla/scripts
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        versions: [">=0"]

  # Security updates for the examples involved in #5267, #5314, and #5359.
  # Keep one directory per entry: a shared directories list would combine examples.
  # Explicit security groups override broad repository/organization grouping here.
  # Other packages get individual PRs; groups describe coupling, not a guarantee
  # of compatibility. Validate each proposed upgrade in its example environment.
  # Limit 0 disables routine version PRs, not security updates or alerts.
  # Other directories remain subject to repository/organization defaults.
  - package-ecosystem: pip
    directory: /examples/advanced/qwen3-vl
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      qwen3-vl-pip-pytorch:
        applies-to: security-updates
        patterns: ["torch", "torchvision", "torchaudio", "torchcodec", "triton", "flash-attn", "flash_attn", "deepspeed"]
      qwen3-vl-pip-huggingface:
        applies-to: security-updates
        patterns: ["transformers", "tokenizers", "huggingface-hub", "huggingface_hub", "safetensors", "accelerate", "peft"]
  - package-ecosystem: uv
    directory: /examples/advanced/qwen3-vl
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      qwen3-vl-uv-pytorch:
        applies-to: security-updates
