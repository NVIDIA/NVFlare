# SMOKE: SmolVLA full fine-tuning on LIBERO with FedAvg, through the NVFlare simulator.
# Same settings as smolvla_libero_fullft_nvflare.yaml except 2 clients, 2 rounds x 20 local steps
# and no eval block: checks the job, the data and the GPU placement on two GPUs.
# Evaluate a checkpoint with scripts/eval_libero.sh.
# Train: decent-vla train --config examples/smolvla_libero_fullft_nvflare_smoke.yaml
name: smolvla_libero_fullft_nvflare_smoke
seed: 42
device: auto

backend:
  name: lerobot
  extra:
    # train_expert_only: false and freeze_vision_encoder: false: the whole model trains.
    train_config_path: examples/smolvla_libero_train_pipeline_fullft_unfrozen.yaml
    dtype: bfloat16
  optim:
    name: adamw
    lr: 1.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-10
    scheduler: cosine
    warmup_steps: 1000
    decay_steps: 30000
    decay_lr: 2.5e-5
    grad_clip_norm: 10

data:
  name: lerobot
  repo_id: HuggingFaceVLA/libero
  batch_size: 32
  num_workers: 12
  extra:
    # Workers forked after the policy is on CUDA can segfault; spawn starts them clean.
    dataloader_mp_context: spawn
  partitioning:
    scheme: task_round_robin        # task non-IID: each client gets a disjoint set of LIBERO tasks
    num_clients: 2
    seed: 42

fl:
  strategy:
    name: fedavg
  rounds: 2
  local_steps: 20
  execution: nvflare
  save_every_n_rounds: 1
  output_dir: outputs/smolvla_libero_fullft_nvflare_smoke
  nvflare:
    env: simulator                # in-process NVFlare simulator
    gpu: "0,1"                    # one entry per client: client i -> GPU in entry i
