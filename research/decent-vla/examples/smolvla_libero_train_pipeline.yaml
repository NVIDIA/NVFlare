# lerobot `TrainPipelineConfig` for the SmolVLA LoRA configs (smolvla_libero_lora_*.yaml).
# SmolVLA's defaults apply: only the action expert trains, the VLM is frozen; LoRA adds
# adapters on the VLM.
#
# Parsed by lerobot's draccus loader inside the adapter
# (adapters/lerobot/backend.py::_load_train_pipeline_config). The `policy:` section,
# minus type and pretrained_path, is applied as overrides on top of the pretrained
# checkpoint's config.
policy:
  type: smolvla
  pretrained_path: lerobot/smolvla_base
  push_to_hub: false
  # smolvla_base declares its SO100 pretraining features (state[6]/action[6]).
  # Override them to the LIBERO dims; without this, eval slices the 7-dim action
  # chunk to 6 (dropping the gripper) and the unnormalizer fails on 6-vs-7 stats.
  input_features:
    observation.state: {type: STATE, shape: [8]}
    observation.images.camera1: {type: VISUAL, shape: [3, 256, 256]}
    observation.images.camera2: {type: VISUAL, shape: [3, 256, 256]}
    observation.images.camera3: {type: VISUAL, shape: [3, 256, 256]}
  output_features:
    action: {type: ACTION, shape: [7]}
dataset:
  repo_id: HuggingFaceVLA/libero
  revision: main
  # pyav decodes LIBERO's AV1 videos; torchcodec failed to load on some of our CUDA stacks.
  video_backend: pyav
# HuggingFaceVLA/libero ships observation.images.image{,2}; SmolVLA expects
# camera1/camera2 (camera3 is zero-filled through empty_cameras).
rename_map:
  observation.images.image: observation.images.camera1
  observation.images.image2: observation.images.camera2
