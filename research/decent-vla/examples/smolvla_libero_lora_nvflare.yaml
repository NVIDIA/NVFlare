# SmolVLA LoRA fine-tuning on LIBERO with FedAvg, through the NVFlare simulator.
# Settings of the paper's run: 8 clients with 5 disjoint LIBERO tasks each, 250 local steps
# per round, 160 rounds. The paper evaluates every 20 rounds and reports the best score.
# 8 clients on one 4-GPU node: clients i and i+4 share a GPU (two fit in 96 GB). The paper
# ran one client per GPU; placement does not change the training.
# Evaluate a checkpoint with scripts/eval_libero.sh.
# Train: decent-vla train --config examples/smolvla_libero_lora_nvflare.yaml
name: smolvla_libero_lora_nvflare
seed: 42
device: auto

backend:
  name: lerobot
  extra:
    train_config_path: examples/smolvla_libero_train_pipeline.yaml
    dtype: bfloat16
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  optim:
    name: adamw
    lr: 1.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-10
    scheduler: cosine
    warmup_steps: 1000
    decay_steps: 30000
    decay_lr: 2.5e-5

data:
  name: lerobot
  repo_id: HuggingFaceVLA/libero
  batch_size: 64
  num_workers: 8
  partitioning:
    scheme: task_round_robin        # task non-IID: each client gets a disjoint set of LIBERO tasks
    num_clients: 8
    seed: 42

fl:
  strategy:
    name: fedavg
  rounds: 160
  local_steps: 250
  execution: nvflare
  save_every_n_rounds: 10
  output_dir: outputs/smolvla_libero_lora_nvflare
  nvflare:
    env: simulator                # in-process NVFlare simulator
    gpu: "0,1,2,3,0,1,2,3"        # one entry per client: client i -> GPU in entry i
