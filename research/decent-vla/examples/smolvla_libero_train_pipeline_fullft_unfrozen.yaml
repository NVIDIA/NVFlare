# lerobot `TrainPipelineConfig` for the SmolVLA full fine-tuning configs
# (smolvla_libero_fullft_*.yaml). Same as smolvla_libero_train_pipeline.yaml except that
# it unfreezes the whole model, so all ~450M parameters train, with no LoRA:
#   train_expert_only: false      train the action expert AND the VLM
#   freeze_vision_encoder: false  also train the SigLIP vision encoder
# SmolVLAConfig's defaults for both are true (expert only, VLM frozen).
policy:
  type: smolvla
  pretrained_path: lerobot/smolvla_base
  push_to_hub: false
  train_expert_only: false
  freeze_vision_encoder: false
  # LIBERO dims (smolvla_base ships SO100 state[6]/action[6]); see smolvla_libero_train_pipeline.yaml.
  input_features:
    observation.state: {type: STATE, shape: [8]}
    observation.images.camera1: {type: VISUAL, shape: [3, 256, 256]}
    observation.images.camera2: {type: VISUAL, shape: [3, 256, 256]}
    observation.images.camera3: {type: VISUAL, shape: [3, 256, 256]}
  output_features:
    action: {type: ACTION, shape: [7]}
dataset:
  repo_id: HuggingFaceVLA/libero
  revision: main
  video_backend: pyav
rename_map:
  observation.images.image: observation.images.camera1
  observation.images.image2: observation.images.camera2
