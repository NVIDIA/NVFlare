# SMOKE: pi0.5 LoRA fine-tuning on LIBERO with FedAvg, through the NVFlare simulator.
# Same settings as pi05_libero_lora_nvflare.yaml except 2 clients, 2 rounds x 20 local steps
# and no eval block: checks the job, the data and the GPU placement on two GPUs.
# Evaluate a checkpoint with scripts/eval_libero.sh.
# Train: decent-vla train --config examples/pi05_libero_lora_nvflare_smoke.yaml
name: pi05_libero_lora_nvflare_smoke
seed: 42
device: auto

backend:
  name: lerobot
  extra:
    policy_type: pi05
    pretrained_path: lerobot/pi05_base
    dtype: bfloat16
    train_config_path: examples/pi05_libero_train_pipeline.yaml
    tokenizer_local_repo: google/paligemma-3b-pt-224   # gated: accept the PaliGemma terms on Hugging Face
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  optim:
    name: adamw
    lr: 2.5e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
    scheduler: cosine
    warmup_steps: 1000
    decay_steps: 30000
    decay_lr: 2.5e-5

data:
  name: lerobot
  repo_id: HuggingFaceVLA/libero
  batch_size: 32
  num_workers: 4
  extra:
    # Workers forked after the policy is on CUDA can segfault; forkserver starts them clean.
    dataloader_mp_context: forkserver
    prefetch_factor: 1              # caps host shared-memory use
  partitioning:
    scheme: task_round_robin        # task non-IID: each client gets a disjoint set of LIBERO tasks
    num_clients: 2
    seed: 42

fl:
  strategy:
    name: fedavg
  rounds: 2
  local_steps: 20
  execution: nvflare
  save_every_n_rounds: 1
  output_dir: outputs/pi05_libero_lora_nvflare_smoke
  nvflare:
    env: simulator                # in-process NVFlare simulator
    gpu: "0,1"                    # one entry per client: client i -> GPU in entry i
