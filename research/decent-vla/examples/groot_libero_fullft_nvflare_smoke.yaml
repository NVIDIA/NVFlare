# SMOKE: GR00T N1.7 full fine-tuning on LIBERO with FedAvg, through the NVFlare simulator.
# Same settings as groot_libero_fullft_nvflare.yaml except 2 clients, 2 rounds x 20 local steps
# and a 10-episode evaluation: checks the job, the data and the GPU placement on two GPUs.
# Train in the GR00T environment (scripts/setup_groot.sh); evaluate with `decent-vla eval`
# in the GR00T eval environment (scripts/setup_groot_eval.sh).
# Train: decent-vla train --config examples/groot_libero_fullft_nvflare_smoke.yaml
name: groot_libero_fullft_nvflare_smoke
seed: 42
device: auto

backend:
  name: groot
  pretrained_path: nvidia/GR00T-N1.7-3B
  optim:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-5
    betas: [0.9, 0.95]
    scheduler: cosine
    warmup_steps: 1000
    decay_steps: 30000
    decay_lr: 1.0e-5
  extra:
    embodiment_tag: LIBERO_PANDA
    state_dropout_prob: 0.2
    dtype: bfloat16
    gradient_checkpointing: true
    # `decent-vla eval` reads LIBERO's normalization statistics and modality ranges from these datasets.
    eval_dataset_paths:
      - data/groot-libero/libero_spatial_no_noops_1.0.0_lerobot
      - data/groot-libero/libero_object_no_noops_1.0.0_lerobot
      - data/groot-libero/libero_goal_no_noops_1.0.0_lerobot
      - data/groot-libero/libero_10_no_noops_1.0.0_lerobot
    local_files_only: true
    # Action head trains in full; the backbone (language model and vision tower) stays frozen.
    tune_llm: false
    tune_visual: false
    tune_projector: true
    tune_diffusion_model: true
    tune_vlln: true

data:
  name: groot
  batch_size: 16
  num_workers: 16
  extra:
    video_backend: pyav                  # AV1 videos; PyAV decoding from scripts/isaac_gr00t_pyav.patch
    dataloader_mp_context: spawn
    episode_sampling_rate: 1.0
    # The four LIBERO suites in GR00T's LeRobot format; scripts/prep_groot_libero.sh
    # downloads and prepares them here.
    dataset_paths:
      - data/groot-libero/libero_spatial_no_noops_1.0.0_lerobot
      - data/groot-libero/libero_object_no_noops_1.0.0_lerobot
      - data/groot-libero/libero_goal_no_noops_1.0.0_lerobot
      - data/groot-libero/libero_10_no_noops_1.0.0_lerobot
  partitioning:
    scheme: task_round_robin        # task non-IID: each client gets a disjoint set of LIBERO tasks
    num_clients: 2
    seed: 42

fl:
  strategy:
    name: fedavg
  rounds: 2
  local_steps: 20
  execution: nvflare
  save_every_n_rounds: 1
  output_dir: outputs/groot_libero_fullft_nvflare_smoke
  nvflare:
    env: simulator                # in-process NVFlare simulator
    gpu: "0,1"                    # one entry per client: client i -> GPU in entry i

eval:
  benchmark:
    name: libero
    suites: [libero_spatial]
  n_episodes_per_task: 1
  eval_all_tasks: true
  seed: 42
