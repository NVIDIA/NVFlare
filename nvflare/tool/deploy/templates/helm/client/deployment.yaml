{{- $jobs := .Values.persistence.jobs | default dict -}}
{{- if $jobs.claimName -}}
{{- if eq $jobs.claimName .Values.persistence.workspace.claimName -}}
{{- fail "persistence.jobs.claimName must differ from the private CP workspace claim" -}}
{{- end -}}
{{- $jobsMount := required "persistence.jobs.mountPath is required" $jobs.mountPath -}}
{{- $jobsPath := clean $jobsMount -}}
{{- $cpPath := clean .Values.persistence.workspace.mountPath -}}
{{- if or (not (hasPrefix "/" $jobsMount)) (eq $jobsPath "/") (eq $jobsPath $cpPath) (hasPrefix (printf "%s/" $cpPath) $jobsPath) (hasPrefix (printf "%s/" $jobsPath) $cpPath) -}}
{{- fail "persistence.jobs.mountPath must be a dedicated absolute directory outside the CP workspace mount" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nvflare-client.name" . }}
  labels:
    {{- include "nvflare-client.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nvflare-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nvflare-client.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "nvflare-client.name" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: {{ .Values.persistence.workspace.volumeName }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.workspace.claimName }}
        {{- if $jobs.claimName }}
        - name: job-workspaces
          persistentVolumeClaim:
            claimName: {{ $jobs.claimName | quote }}
        {{- end }}
        {{- with .Values.workspaceConfig }}
        {{- with .local }}
        {{- if .configMapName }}
        - name: workspace-local
          configMap:
            name: {{ .configMapName }}
            {{- with .items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with .startup }}
        {{- if .secretName }}
        - name: workspace-startup
          secret:
            secretName: {{ .secretName }}
            {{- with .items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
      containers:
        - name: {{ include "nvflare-client.name" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          image: {{ include "nvflare-client.image" . }}
          ports:
            - containerPort: {{ .Values.port }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
            - uid={{ default .Values.name .Values.siteName }}
          volumeMounts:
            - name: {{ .Values.persistence.workspace.volumeName }}
              mountPath: {{ .Values.persistence.workspace.mountPath }}
            {{- if $jobs.claimName }}
            - name: job-workspaces
              mountPath: {{ $jobs.mountPath | quote }}
            {{- end }}
            {{- with .Values.workspaceConfig }}
            {{- with .local }}
            {{- if .configMapName }}
            - name: workspace-local
              mountPath: {{ $.Values.persistence.workspace.mountPath }}/local
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .startup }}
            {{- if .secretName }}
            - name: workspace-startup
              mountPath: {{ $.Values.persistence.workspace.mountPath }}/startup
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
