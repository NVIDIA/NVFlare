schema_version: 1
cc_deployment_mode: bare_metal_cvm
cpu_tee: amd_sev_snp
gpu_tee: nvidia_cc
attestation:
  service: trustee
# The bundled non-BYOC job uses this executor to launch client.py from the
# measured application image. Keep this as an exact, reviewed per-site grant.
class_allow_list:
  - nvflare.app_common.executors.client_api_executor.ClientAPIExecutor
workload:
  source:
    type: docker_archive
    path: /srv/nvflare/images/application.tar
bare_metal_cvm:
  cvm_image: /srv/cvm/images/amd-gpu
  storage:
    vault_size_gib: 16
  network:
    allowed_out_ports: [8443]
