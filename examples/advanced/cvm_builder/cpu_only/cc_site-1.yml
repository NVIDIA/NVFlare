schema_version: 1
cc_deployment_mode: bare_metal_cvm
cpu_tee: amd_sev_snp
gpu_tee: none
attestation:
  service: trustee
# The parent example job uses this measured-image, in-process executor.
class_allow_list:
  - nvflare.app_common.logging.job_log_streamer.JobLogStreamer
  - cvm_client_api_executor.CVMClientAPIExecutor
workload:
  source:
    type: docker_archive
    path: /srv/nvflare/images/application.tar
bare_metal_cvm:
  # Replace this TEST-NET address with the client-reachable server host IP.
  hosts_entries:
    server.example.invalid: 192.0.2.10
  cvm_image: /srv/cvm/images/snp-cpu
  storage:
    # Budget example only; measure expanded content and writes (see the Docker README).
    vault_size_gib: 64
  network:
    allowed_out_ports: [8443]
