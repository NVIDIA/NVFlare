# site-1 dataset configuration. example_setup.py copies it into the site's startup kit as local/datasets.yaml,
# where a deployed site keeps it.
format_version: 1
studies:
  default:
    datasets:
      clinical_records:            # the omop schema registered in the site's Unity Catalog server
        type: unity-catalog
        uri: http://unity-catalog:8080/api/2.1/unity-catalog   # API root; authorization is off in this demo
        options: {catalog: flare_demo, schema: omop}
