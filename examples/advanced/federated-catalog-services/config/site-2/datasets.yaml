# site-2 dataset configuration. Compose mounts it read-only into the site container and names it in
# NVFLARE_DATASET_CONFIG.
format_version: 1
studies:
  default:
    datasets:
      omop:                       # the omop schema of the site's PostgreSQL database
        type: sql
        uri: postgresql+pg8000://postgres:5432/omop             # no credentials in the uri
        options:
          schema: omop
          connect_args: {timeout: 5}                           # pg8000's socket timeout, in seconds
        secrets: {username: CATALOG_DB_USER, password: CATALOG_DB_PASSWORD}   # environment variable names
        usage:
          catalog:
            share: true
            exclude_columns:
              person: [person_source_value]
              condition_occurrence: [condition_source_value]
              drug_exposure: [drug_source_value]
