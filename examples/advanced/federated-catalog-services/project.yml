api_version: 3
name: catalog-demo
participants:
  - name: nvflare-poc-server
    type: server
    org: nvidia
    default_host: nvflare-poc-server
    host_names: [localhost]
    fed_learn_port: 8002
    admin_port: 8003
  - {name: site-1, type: client, org: nvidia}
  - {name: site-2, type: client, org: nvidia}
  - {name: admin@nvidia.com, type: admin, org: nvidia, role: project_admin}
builders:
  - path: nvflare.lighter.impl.workspace.WorkspaceBuilder
  - path: nvflare.lighter.impl.static_file.StaticFileBuilder
    args: {config_folder: config}
  - path: nvflare.lighter.impl.cert.CertBuilder
  - path: nvflare.lighter.impl.signature.SignatureBuilder
