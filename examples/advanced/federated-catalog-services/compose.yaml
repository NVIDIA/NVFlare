name: flare-catalog-services
x-flare: &flare
  image: nvflare-catalog-demo:local
  build:
    context: ../../..
    dockerfile: examples/advanced/federated-catalog-services/Dockerfile
  init: true
  stop_grace_period: 45s
services:
  nvflare-poc-server:
    <<: *flare
    environment:
      NVFL_WORKSPACE: /poc/catalog-demo/prod_00/nvflare-poc-server
    ports: ["127.0.0.1:8002:8002", "127.0.0.1:8003:8003"]
    volumes:
      - type: bind
        source: ./workspace/catalog-demo/prod_00/nvflare-poc-server
        target: /poc/catalog-demo/prod_00/nvflare-poc-server
        bind: {create_host_path: false}
      - ./workspace/jobs-storage:${PWD}/workspace/jobs-storage
      - ./workspace/snapshot-storage:${PWD}/workspace/snapshot-storage
      - ./config/server/catalog__p_resources.json:/poc/catalog-demo/prod_00/nvflare-poc-server/local/catalog__p_resources.json:ro
  nvflare-poc-site-1:
    <<: *flare
    environment:
      NVFL_WORKSPACE: /poc/catalog-demo/prod_00/site-1
      UNITY_CATALOG_URL: http://unity-catalog:8080/api/2.1/unity-catalog
    volumes:
      - type: bind
        source: ./workspace/catalog-demo/prod_00/site-1
        target: /poc/catalog-demo/prod_00/site-1
        bind: {create_host_path: false}
      - site-1-data:/data
      - ./config/site-1/catalog_site.json:/poc/catalog-demo/prod_00/site-1/local/fdn/catalog_site.json:ro
      - ./config/site-1/catalog_policy.json:/poc/catalog-demo/prod_00/site-1/local/fdn/default/catalog_policy.json:ro
    post_start:
      - command: ["python", "prepare_data.py", "site-1"]
    depends_on:
      unity-catalog: {condition: service_started}
  nvflare-poc-site-2:
    <<: *flare
    environment:
      NVFL_WORKSPACE: /poc/catalog-demo/prod_00/site-2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-bootstrap}
      CATALOG_DATABASE_URL: postgresql+psycopg://catalog_reader:local-demo-reader@postgres:5432/sanctuary
    volumes:
      - type: bind
        source: ./workspace/catalog-demo/prod_00/site-2
        target: /poc/catalog-demo/prod_00/site-2
        bind: {create_host_path: false}
      - ./config/site-2/catalog_site.json:/poc/catalog-demo/prod_00/site-2/local/fdn/catalog_site.json:ro
      - ./config/site-2/catalog_policy.json:/poc/catalog-demo/prod_00/site-2/local/fdn/default/catalog_policy.json:ro
    post_start:
      - command: ["python", "prepare_data.py", "site-2"]
    depends_on:
      postgres: {condition: service_healthy}
  unity-catalog:
    image: unitycatalog/unitycatalog:v0.7.0
    volumes: ["site-1-data:/home/unitycatalog/demo-data:ro"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sanctuary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-bootstrap}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanctuary"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  site-1-data:
  postgres-data:
