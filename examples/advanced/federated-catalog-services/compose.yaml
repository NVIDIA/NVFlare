name: flare-catalog-services
x-flare: &flare
  image: nvflare-catalog-demo:local
  build:
    context: ../../..
    dockerfile: examples/advanced/federated-catalog-services/Dockerfile
  init: true
  stop_grace_period: 45s
  tmpfs: ["/workspace"]
  pre_stop:
    - command:
        - bash
        - -c
        - |
          printf 'y\n' | /startup-kit/startup/stop_fl.sh
services:
  nvflare-server:
    <<: *flare
    environment:
      NVFL_WORKSPACE: /workspace
    ports: ["127.0.0.1:8002:8002", "127.0.0.1:8003:8003"]
    volumes:
      - type: bind
        source: ${CATALOG_KITS:?Run python example_setup.py first}/nvflare-server
        target: /startup-kit
        read_only: true
        bind: {create_host_path: false}
      - server-catalog:/workspace/fdn
      - jobs-storage:/tmp/nvflare/jobs-storage
      - snapshot-storage:/tmp/nvflare/snapshot-storage
  nvflare-site-1:
    <<: *flare
    environment:
      NVFL_WORKSPACE: /workspace
      NVFLARE_CATALOG_POLICY_ROOT: /fdn/policy
      UNITY_CATALOG_URL: http://unity-catalog:8080/api/2.1/unity-catalog
    volumes:
      - type: bind
        source: ${CATALOG_KITS:?Run python example_setup.py first}/site-1
        target: /startup-kit
        read_only: true
        bind: {create_host_path: false}
      - site-1-data:/data
      - ./config/site-1/catalog_site.json:/fdn/policy/catalog_site.json:ro
      - ./config/site-1/catalog_policy.json:/fdn/policy/default/catalog_policy.json:ro
    post_start:
      - command: ["python", "prepare_data.py", "site-1"]
    depends_on:
      unity-catalog: {condition: service_started}
  nvflare-site-2:
    <<: *flare
    environment:
      NVFL_WORKSPACE: /workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-bootstrap}
      NVFLARE_CATALOG_POLICY_ROOT: /fdn/policy
      CATALOG_DATABASE_URL: postgresql+psycopg://catalog_reader:local-demo-reader@postgres:5432/sanctuary
    volumes:
      - type: bind
        source: ${CATALOG_KITS:?Run python example_setup.py first}/site-2
        target: /startup-kit
        read_only: true
        bind: {create_host_path: false}
      - ./config/site-2/catalog_site.json:/fdn/policy/catalog_site.json:ro
      - ./config/site-2/catalog_policy.json:/fdn/policy/default/catalog_policy.json:ro
    post_start:
      - command: ["python", "prepare_data.py", "site-2"]
    depends_on:
      postgres: {condition: service_healthy}
  unity-catalog:
    image: unitycatalog/unitycatalog:v0.7.0
    volumes: ["site-1-data:/home/unitycatalog/demo-data:ro"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sanctuary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-bootstrap}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanctuary"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  site-1-data:
  postgres-data:
  server-catalog:
  jobs-storage:
  snapshot-storage:
