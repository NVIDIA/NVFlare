    <rect x="244" y="150" width="160" height="48" rx="6" fill="#fff4e5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="324" y="171" font-size="13" font-weight="bold" text-anchor="middle">cohort.py</text>
