<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Helvetica, Arial, sans-serif" fill="#1f2328">
  <title>Each site runs the same OMOP cohort query and trains with NVFlare</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4e7a00"/>
    </marker>
  </defs>
  <rect width="1000" height="340" fill="#ffffff"/>
  <g id="site-1">
    <rect x="12" y="16" width="768" height="96" rx="12" fill="#f6f8fa" stroke="#afb8c1" stroke-dasharray="5 4"/>
    <text x="26" y="34" font-size="12" fill="#57606a">site-1</text>
    <path d="M40,44 v44 a80,8 0 0 0 160,0 v-44" fill="#eaf2fb" stroke="#4a7fc1" stroke-width="1.5"/>
    <ellipse cx="120" cy="44" rx="80" ry="8" fill="#eaf2fb" stroke="#4a7fc1" stroke-width="1.5"/>
    <text x="120" y="72" font-size="13" font-weight="bold" text-anchor="middle">OMOP CDM</text>
    <text x="120" y="88" font-size="11" fill="#57606a" text-anchor="middle">ICD-10-CM K92.2</text>
    <rect x="244" y="42" width="160" height="48" rx="6" fill="#fff4e5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="324" y="63" font-size="13" font-weight="bold" text-anchor="middle">cohort.py</text>
    <text x="324" y="80" font-size="11" fill="#57606a" text-anchor="middle">concept 192671</text>
    <rect x="448" y="42" width="112" height="48" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="504" y="71" font-size="13" font-weight="bold" text-anchor="middle">X, y</text>
    <rect x="604" y="42" width="152" height="48" rx="6" fill="#ffffff" stroke="#76b900" stroke-width="1.5"/>
    <text x="680" y="71" font-size="13" font-weight="bold" text-anchor="middle">client.py</text>
    <g stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="202" y1="66" x2="242" y2="66"/>
      <line x1="406" y1="66" x2="446" y2="66"/>
      <line x1="562" y1="66" x2="602" y2="66"/>
    </g>
    <g stroke="#4e7a00" stroke-width="1.5" marker-end="url(#arrow-green)">
      <line x1="758" y1="57" x2="830" y2="57"/>
      <line x1="832" y1="75" x2="760" y2="75"/>
    </g>
    <text x="806" y="51" font-size="12" text-anchor="middle">g, H</text>
    <text x="806" y="91" font-size="12" text-anchor="middle">θ</text>
  </g>
  <g id="site-2">
    <rect x="12" y="124" width="768" height="96" rx="12" fill="#f6f8fa" stroke="#afb8c1" stroke-dasharray="5 4"/>
