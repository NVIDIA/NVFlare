      <line x1="562" y1="174" x2="602" y2="174"/>
    </g>
    <g stroke="#4e7a00" stroke-width="1.5" marker-end="url(#arrow-green)">
      <line x1="758" y1="165" x2="830" y2="165"/>
      <line x1="832" y1="183" x2="760" y2="183"/>
    </g>
    <text x="806" y="159" font-size="12" text-anchor="middle">g, H</text>
    <text x="806" y="199" font-size="12" text-anchor="middle">θ</text>
  </g>
  <g id="site-3">
    <rect x="12" y="232" width="768" height="96" rx="12" fill="#f6f8fa" stroke="#afb8c1" stroke-dasharray="5 4"/>
    <text x="26" y="250" font-size="12" fill="#57606a">site-3</text>
    <path d="M40,260 v44 a80,8 0 0 0 160,0 v-44" fill="#eaf2fb" stroke="#4a7fc1" stroke-width="1.5"/>
    <ellipse cx="120" cy="260" rx="80" ry="8" fill="#eaf2fb" stroke="#4a7fc1" stroke-width="1.5"/>
    <text x="120" y="288" font-size="13" font-weight="bold" text-anchor="middle">OMOP CDM</text>
    <text x="120" y="304" font-size="11" fill="#57606a" text-anchor="middle">local GIBLEED</text>
    <rect x="244" y="258" width="160" height="48" rx="6" fill="#fff4e5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="324" y="279" font-size="13" font-weight="bold" text-anchor="middle">cohort.py</text>
    <text x="324" y="296" font-size="11" fill="#57606a" text-anchor="middle">concept 192671</text>
    <rect x="448" y="258" width="112" height="48" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="504" y="287" font-size="13" font-weight="bold" text-anchor="middle">X, y</text>
    <rect x="604" y="258" width="152" height="48" rx="6" fill="#ffffff" stroke="#76b900" stroke-width="1.5"/>
    <text x="680" y="287" font-size="13" font-weight="bold" text-anchor="middle">client.py</text>
    <g stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="202" y1="282" x2="242" y2="282"/>
      <line x1="406" y1="282" x2="446" y2="282"/>
      <line x1="562" y1="282" x2="602" y2="282"/>
    </g>
    <g stroke="#4e7a00" stroke-width="1.5" marker-end="url(#arrow-green)">
      <line x1="758" y1="273" x2="830" y2="273"/>
      <line x1="832" y1="291" x2="760" y2="291"/>
    </g>
    <text x="806" y="267" font-size="12" text-anchor="middle">g, H</text>
    <text x="806" y="307" font-size="12" text-anchor="middle">θ</text>
  </g>
  <rect x="834" y="16" width="154" height="312" rx="12" fill="#f1f8e6" stroke="#76b900" stroke-width="1.5"/>
  <text x="911" y="166" font-size="14" font-weight="bold" text-anchor="middle">NVFlare server</text>
  <text x="911" y="186" font-size="12" text-anchor="middle">FedAvgLrRecipe</text>
