# site-3 dataset configuration. prepare_data.py installs it as <data-root>/site-3/local/datasets.yaml,
# replacing ${SITE_DATA} with the site's absolute data folder.
format_version: 1
studies:
  default:
    datasets:
      omop:                       # a DuckDB database file
        type: duckdb
        uri: file://${SITE_DATA}/omop.duckdb
        usage:
          catalog:
            share: true
            exclude_columns:
              person: [person_source_value]
              condition_occurrence: [condition_source_value]
usage:
  catalog:
    connectors:                   # DuckDB is not built in, so the site declares its connector class
      duckdb: {class: nvflare.app_opt.fdn.catalog.duckdb_connector.DuckDBConnector}
