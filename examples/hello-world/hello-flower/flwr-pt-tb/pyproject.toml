[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tested with:
#   flwr==1.27.0
#   NVFlare supplied by the parent environment (release, local wheel, or editable install)
#   torch==2.11.0
#   torchvision==0.26.0
#   tensorboard==2.20.0

[project]
name = "flwr-pt-tb"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    # Flower 1.40+ removes the gRPC-adapter transport used by NVFlare.
    "flwr>=1.26,<1.40",
    "torch",
    "torchvision",
    "tensorboard"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "nvidia"

[tool.flwr.app.components]
serverapp = "flwr_pt_tb.server:app"
clientapp = "flwr_pt_tb.client:app"

[tool.flwr.app.config]
num-server-rounds = 3
learning-rate = 0.001
momentum = 0.9
